      let solved = false, wrong = false;
      shelf.querySelectorAll('.ing').forEach(b => b.onclick = () => {
        if (solved || b.classList.contains('wrong')) return;
        const o = opts[+b.dataset.k];
        if (o.w === t.w) {
          solved = true; b.classList.add('gone'); sfx.ok(); hideCheer();
          inbowl.insertAdjacentHTML('beforeend', `<span>${t.e}</span>`);
          record(t.w, wrong); ctx.learned.add(t.w);
          later(() => speak(line), 150);
          i++; later(round, 1500);
        } else {
          b.classList.add('wrong'); mistakes++; wrong = true; sfx.no(); cheer([[o.w, false]]);
        }
      });
    }
    round();
  },

  card(ctx, opt = {}) {
    const maxLen = { basic: 4, adv: 6, pro: 9 }[ctx.ver];
    const pool = opt.pool || openPool().filter(it => /^[A-Za-z]+$/.test(it.w) && it.w.length <= maxLen && it.w.length >= 3 && !it.c);
    const words = pickTargets(pool, 5);
    let i = 0, mistakes = 0;
    ctx.stage.innerHTML = `<div class="spell"><button class="pic" aria-label="聽發音"></button><div class="slots"></div><div class="flakes"></div></div>`;
    const pic = ctx.stage.querySelector('.pic'), slots = ctx.stage.querySelector('.slots'), flakes = ctx.stage.querySelector('.flakes');
    function round() {
      setDots(words.length, i);
      if (i >= words.length) { later(() => ctx.done(mistakes), 400); return; }
      const t = words[i], w = t.w, low = w.toLowerCase();
      let pos = opt.firstGiven || ctx.ver === 'basic' ? 1 : 0, wrong = false;
      pic.innerHTML = face(t) + '<small>🔊</small>';
      pic.onclick = () => speak(w);
      later(() => speak(w), 300);
      slots.innerHTML = [...w].map((ch, k) => `<span class="slot ${k < pos ? 'filled' : 'blank'}">${k < pos ? ch : ''}</span>`).join('');
      const rest = low.slice(pos);
      let tiles = [...rest];
      for (let tries = 0; tries < 10 && tiles.length > 1 && tiles.join('') === rest; tries++) tiles = shuffle(tiles);
      flakes.innerHTML = tiles.map(c => `<button class="flake ${opt.bubble ? 'bub' : ''}" data-c="${c}"><span>${c}</span></button>`).join('');
      const mark = () => [...slots.children].forEach((s, k) => s.classList.toggle('cur', k === pos));
      mark();
      flakes.querySelectorAll('.flake').forEach(b => b.onclick = () => {
        if (b.classList.contains('used') || pos >= w.length) return;
        if (b.dataset.c === low[pos]) {
          b.classList.add('used'); hideCheer();
          const slot = slots.children[pos];
          slot.textContent = w[pos]; slot.classList.remove('blank', 'cur'); slot.classList.add('filled');
          tone(988, 0, .15, 'triangle', .08);
          pos++; mark();
          if (pos >= w.length) {
            sfx.ok(); record(w, wrong); ctx.learned.add(w);
            later(() => speak(w), 200);
            i++; later(round, 1500);
          }
        } else {
          b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong');
          setTimeout(() => b.classList.remove('wrong'), 450);
          mistakes++; wrong = true; sfx.no(); cheer();
        }
      });
    }
    round();
  },

  tower(ctx) {
    const pool = openPool(), goal = 10;
    let height = 0, mistakes = 0;
    ctx.stage.innerHTML = `<div class="boss"><div class="towerbox"></div><div class="bossq"></div></div>`;
    const box = ctx.stage.querySelector('.towerbox');
    const draw = () => {
      box.innerHTML = Array.from({ length: height }, (_, k) => `<span class="ball" style="--s:${R(78 - k * 4.5)}px"></span>`).join('')
        + `<span class="tcount">${height} / ${goal}</span>`;
      setDots(goal, height);
    };
    draw();
    quiz(ctx.stage.querySelector('.bossq'), {
      targets: Array.from({ length: 40 }, () => pickOne(pool)), pool, nOpt: ctx.nOpt, learned: ctx.learned, noDots: true,
      onCorrect: () => {
        height++; draw();
        if (height >= goal) { sfx.win(); speak('What a tall snowman!', 0.9); later(() => ctx.done(mistakes), 1600); return 'stop'; }
      },
      onWrong: () => {
        mistakes++;
        if (height > 0) {
          const top = box.querySelectorAll('.ball')[height - 1];
          if (top) top.classList.add('fall');
          height--; later(draw, 500);
        }
      },
      onDone: () => {}
    });
  },

  review(ctx) {
    const all = versionWords(), l = L();
    let weak = all.filter(it => isWeak(it.w)).sort((a, b) => l.words[b.w].bad - l.words[a.w].bad).slice(0, 8);
    if (weak.length < 6) weak = [...weak, ...sample(all.filter(it => !weak.includes(it) && l.words[it.w]?.ok), 6 - weak.length)];
    if (weak.length < 6) weak = [...weak, ...sample(openPool().filter(it => !weak.includes(it)), 6 - weak.length)];
    quiz(ctx.stage, { targets: shuffle(weak), pool: all, nOpt: ctx.nOpt, learned: ctx.learned,
                      onDone: m => later(() => ctx.done(m), 300) });
  }
};

/* ================= stage backgrounds ================= */
const rnd = seed => () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const lg = (id, stops) => `<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">${stops.map(([o, c]) => `<stop offset="${o}" stop-color="${c}"/>`).join('')}</linearGradient>`;
const svgScene = (defs, body) => `<svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice"><defs>${defs}</defs>${body}</svg>`;
function starField(n, seed, maxY) {
  const r = rnd(seed); let out = '';
  for (let i = 0; i < n; i++) out += `<circle cx="${R(r() * 1600)}" cy="${R(r() * maxY)}" r="${(0.8 + r() * 1.6).toFixed(1)}" fill="#fff" opacity="${(0.3 + r() * 0.6).toFixed(2)}"/>`;
  return out;
}
function pine(x, base, h, fill, snow) {
  let out = `<rect x="${R(x - h * .04)}" y="${R(base - h * .13)}" width="${R(h * .08)}" height="${R(h * .13)}" fill="#24170f"/>`;
  for (let k = 0; k < 3; k++) {
    const top = base - h + k * h * .26, bot = top + h * .42 + k * h * .03, hw = h * .5 * (.38 + .22 * k);
    const sh = h * .1, sw = hw * sh / (bot - top);
    out += `<polygon points="${R(x)},${R(top)} ${R(x + hw)},${R(bot)} ${R(x - hw)},${R(bot)}" fill="${fill}"/>`
         + `<polygon points="${R(x)},${R(top)} ${R(x + sw)},${R(top + sh)} ${R(x + sw * .3)},${R(top + sh * .75)} ${R(x)},${R(top + sh)} ${R(x - sw * .4)},${R(top + sh * .75)} ${R(x - sw)},${R(top + sh)}" fill="${snow}"/>`;
  }
  return out;
}
function skyline(seed, ground, minH, maxH, colors, lit) {
  const r = rnd(seed); let out = '', x = -20;
  while (x < 1620) {
    const w = 90 + r() * 110, h = minH + r() * (maxH - minH), top = ground - h, c = colors[Math.floor(r() * colors.length)];
    out += `<rect x="${R(x)}" y="${R(top)}" width="${R(w)}" height="${R(h + 200)}" fill="${c}"/>`;
    if (r() < .5) out += `<polygon points="${R(x - 6)},${R(top)} ${R(x + w / 2)},${R(top - w * .35)} ${R(x + w + 6)},${R(top)}" fill="${c}"/>`;
    for (let wy = top + 24; wy < ground - 30; wy += 52)
      for (let wx = x + 18; wx < x + w - 30; wx += 42)
        if (r() < .45) out += `<rect x="${R(wx)}" y="${R(wy)}" width="18" height="24" rx="3" fill="${lit}" opacity="${(0.55 + r() * 0.45).toFixed(2)}"/>`;
    x += w + 6;
  }
  return out;
}

/* ================= final-stage reward: three animations in turn ================= */
function makeFx(cv) {
  const g = cv.getContext('2d'), d = Math.min(devicePixelRatio || 1, 2);
  const W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W * d; cv.height = H * d; g.setTransform(d, 0, 0, d, 0, 0);
  const COLORS = ['#ffc53d', '#e5484d', '#2fb36b', '#5aa9ff', '#ff8fc7', '#fff1c7'];
  let parts = [], alive = true;
  const add = p => parts.push(Object.assign({ vx: 0, vy: 0, g: .08, life: 60, age: 0, size: 3, color: pickOne(COLORS), drag: .985 }, p));
  function burst(x, y, n = 60, speed = 5.5, colors = [pickOne(COLORS), pickOne(COLORS)]) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.283, v = speed * (.35 + Math.random() * .65);
      add({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 55 + Math.random() * 35, size: 2 + Math.random() * 2.5, color: pickOne(colors), g: .06 });
    }
  }
  function confetti(n = 90) {
    for (let i = 0; i < n; i++)
      add({ x: Math.random() * W, y: -20 - Math.random() * H * .5, vx: (Math.random() - .5) * 2, vy: 2 + Math.random() * 2, g: .03, life: 320, size: 7 + Math.random() * 5, rect: true, rot: Math.random() * 6, vr: (Math.random() - .5) * .3, drag: 1 });
  }
  function sparkle(x, y) {
    for (let i = 0; i < 3; i++)
      add({ x, y, vx: (Math.random() - .5) * 1.6, vy: (Math.random() - .5) * 1.6, g: .02, life: 45, size: 1.5 + Math.random() * 2.5, color: pickOne(['#fff1c7', '#ffc53d', '#ffffff']) });
  }
  function rocket() {
    add({ x: W * (.15 + Math.random() * .7), y: H + 10, vx: (Math.random() - .5) * 1.5, vy: -Math.sqrt(2 * .12 * H * (.5 + Math.random() * .2)), g: .12, life: 300, size: 3, color: '#fff1c7', drag: 1, rocket: true });
  }
  // physics in 60fps "frames" scaled by real elapsed time, so 30Hz and 120Hz screens look the same
  let last = 0;
  function tick(now) {
    if (!alive) return;
    const dt = last ? Math.min(4, (now - last) / 16.67) : 1; last = now;
    g.clearRect(0, 0, W, H);
    // particles spawned during this pass (rocket bursts) land in the fresh array and are kept
    const cur = parts; parts = [];
    const kept = cur.filter(p => {
      const dr = Math.pow(p.drag, dt);
      p.age += dt; p.vx *= dr; p.vy = p.vy * dr + p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.rocket && p.vy > -1) { burst(p.x, p.y); tone(180 + Math.random() * 120, 0, .3, 'triangle', .07); return false; }
      if (p.age > p.life || p.y > H + 40) return false;
      g.globalAlpha = p.rect ? 1 : Math.max(0, 1 - p.age / p.life);
      g.fillStyle = p.color;
      if (p.rect) { p.rot += p.vr * dt; g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); g.restore(); }
      else { g.beginPath(); g.arc(p.x, p.y, p.size, 0, 6.283); g.fill(); }
      return true;
    });
    parts = kept.concat(parts);
    g.globalAlpha = 1;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  return { burst, confetti, sparkle, rocket, stop() { alive = false; } };
}
const REWARDS = [
  // 1. Santa's sleigh flies across, dropping presents
  (stage, fx, timers) => {

      ['🧸', '⭐', '🍬', '🎄', '🍪', '🦌'].forEach((e, k) => {

  let ended = false;

(function () {
  const cv = $('#snow'), g = cv.getContext('2d');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, flakes = [];
  function size() {
    const d = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * d; cv.height = H * d; g.setTransform(d, 0, 0, d, 0, 0);
    flakes = Array.from({ length: Math.round(W * H / 14000) }, () => ({
      x: Math.random() * W, y: Math.random() * H, r: 1 + Math.random() * 2.6, s: .25 + Math.random() * .8, o: Math.random() * 6
    }));
    draw(0);
  }
  function draw(t) {
    g.clearRect(0, 0, W, H); g.fillStyle = '#ffffff';
    for (const f of flakes) {
      g.globalAlpha = .3 + f.r / 6;
      g.beginPath(); g.arc(f.x + Math.sin(t / 1600 + f.o) * 10, f.y, f.r, 0, 6.283); g.fill();
    }
  }
  function tick(t) {
    for (const f of flakes) { f.y += f.s; if (f.y > H + 6) { f.y = -6; f.x = Math.random() * W; } }
    draw(t); requestAnimationFrame(tick);
  }
  addEventListener('resize', size); size();
  if (!still) requestAnimationFrame(tick);
})();

// Chinese with English words inside: the Chinese voice rushes through "a" or "an",
// so each English word is read by the English voice, slowly, between the Chinese parts
function zhParts(text, slow = 1) {
  return text.replace(/a、e、i、o、u/g, 'A, E, I, O, U').split(/(?<=[。！？，：])/)
    .flatMap(sen => sen.split(/([A-Za-z][A-Za-z' ,]*[A-Za-z]|[A-Za-z])/))
    .map(x => x.trim().replace(/^[.,!?]+\s*/, '')).filter(x => x && !/^[，。、：！？「」…\s]+$/.test(x))
    .map(x => /[A-Za-z]/.test(x) ? [x, false, (x.length <= 3 ? .45 : .55) * slow, 450] : [x, true, zhRate() * slow, 220])
    .map((p, k, all) => all[k + 1] && !all[k + 1][1] ? [p[0], p[1], p[2], Math.max(p[3], 380)] : p);
}

/* ---------- question picking and sentence statistics ---------- */
const skey = q => '✎' + (q.say || q.id);
function pickQ(bank, n) {
  const last = q => (L().words[skey(q)] || {}).last || 0;
  const weak = shuffle(bank.filter(q => isWeak(skey(q)))).slice(0, 2);
  const core = shuffle(bank.filter(q => q.core && !weak.includes(q))).slice(0, 1);
  const rest = bank.filter(q => !weak.includes(q) && !core.includes(q))
    .map(q => [q, last(q) + Math.random() * 9e5]).sort((x, y) => x[1] - y[1]).map(x => x[0]);
  return shuffle([...weak, ...core, ...rest].slice(0, n));
}
const srec = (q, wrong) => record(skey(q), wrong);

/* ---------- speaking: the voice says it, then the child says it ---------- */
let SRATE = +(devPref('xmas-en-rate') || .6);
function utter(text, zh, rate) {
  const u = new SpeechSynthesisUtterance(text);
  u.lang = zh ? 'zh-TW' : 'en-US';
  const v = zh ? voiceZh : voiceEn; if (v) u.voice = v;
  u.rate = rate || (zh ? .95 : SRATE); u.pitch = zh ? 1.15 : 1.1;
  return u;
}
// say it, then cb(ms the voice took)
function speakThen(text, rate, cb) {
  const words = text.split(/\s+/).length;
  let done = false, started = 0;
  const fin = () => { if (done) return; done = true; cb(started ? Date.now() - started : words * 420); };
  if (!canSpeak) { setTimeout(fin, 300); return; }
  try {
    paceToken++; speechSynthesis.cancel();
    const u = utter(text, false, rate);
    u.onstart = () => { started = Date.now(); };
    u.onend = fin; u.onerror = fin;
    speechSynthesis.speak(u);
  } catch (e) { fin(); }
  setTimeout(fin, words * 800 + 3000);  // some voices never send onend
}

      const lv = micLevel(), dt = Math.min(100, now - last); last = now;
      lvBar.firstChild.style.width = Math.min(100, lv / (thr || floorMin) * 50) + '%';
      lvBar.classList.toggle('on', !!thr && lv > thr);
      if (!thr) {
        samples.push(lv);
        // the room's noise: the quieter half of what was heard, so a child who starts talking at once does not raise the bar
        if (Date.now() - t0 > 450) {
          const q = samples.slice().sort((x, y) => x - y)[Math.floor(samples.length / 2)] || 0;
          thr = Math.min(ceil, Math.max(floorMin, q * mult)); setStat('🎤 換你說！'); recStart(); quietSince = Date.now();
        }
      } else if (!talking) {
        if (lv > thr) { got += dt; quietSince = Date.now(); if (!start) start = Date.now(); }
        grow.style.setProperty('--g', Math.min(1, got / need).toFixed(3));
        grow.classList.toggle('loud', lv > thr);
        if (got >= need && !enough) { enough = true; setStat('👍 很好！說完了嗎？'); }
        // keep listening until the child stops for a moment, so the recording holds the whole sentence
        if (enough && (Date.now() - quietSince > 1500 || Date.now() - start > longest)) return finishTurn();
        if (!enough && !hinted && Date.now() - quietSince > 8000) { hinted = true; setStat('🔊 再聽一次，跟著說！'); voice(); }
      }
      setTimeout(tick, 40);
    };
    tick();
  }
  ov.addEventListener('click', e => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    const a = b.dataset.a;
    if (a === 'again' && !talking) voice();
    if (a === 'slow' && !talking) voice(SRATE * .75);
    if (a === 'go' && phase === 'ready' && !talking) startTurn();
    if (a === 'skip' && phase === 'listen') finishTurn();
    if (a === 'redo') restart();
    if (a === 'next') close();
    if (a === 'play' && recUrl) {
      try { if (player) player.pause(); player = new Audio(recUrl); player.play(); } catch (e) {}
    }
  });
  voice();
}

// drag (or tap) a pointer target onto one of the drop zones; onDrop(zoneEl|null)
function dragTo(el, zones, onDrop) {
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    const sx = e.clientX, sy = e.clientY; let ghost = null;
    const move = ev => {
      if (!ghost && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 10) {
        ghost = el.cloneNode(true); ghost.classList.add('sghost'); document.body.appendChild(ghost); el.classList.add('dragging');
      }
      if (ghost) { ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px'; }
    };
    const up = ev => {
      removeEventListener('pointermove', move); removeEventListener('pointerup', up); removeEventListener('pointercancel', up);
      if (!ghost) { onDrop(null, true); return; }   // a tap: the game decides
      ghost.remove(); el.classList.remove('dragging');
      if (ev.type !== 'pointerup') return;
      const hit = zones().find(z => { const r = z.getBoundingClientRect(); return ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom; });
      onDrop(hit || null, false);
    };
    addEventListener('pointermove', move); addEventListener('pointerup', up); addEventListener('pointercancel', up);
  });
}

// "Give me the red gift." -- only one is right; "Give me a gift." -- any one is fine
function theRound() {
  const cols = shuffle(['red', 'blue', 'green', 'yellow', 'purple', 'pink', 'orange']);
  const type = pickOne(['color', 'color', 'size', 'both', 'any']);
  let gifts, t, ask, say;
  if (type === 'color') {
    gifts = cols.slice(0, 3).map(c => ({ c, s: '' })); t = gifts[0];
    ask = `Give me the ${t.c} gift.`; say = `Here is the ${t.c} gift.`;
  } else if (type === 'size') {
    const big = Math.random() < .5;
    gifts = [{ c: cols[0], s: big ? 'big' : 'small' }, { c: cols[1], s: big ? 'small' : 'big' }, { c: cols[2], s: big ? 'small' : 'big' }];
    t = gifts[0]; ask = `Give me the ${t.s} gift.`; say = `Here is the ${t.s} gift.`;
  } else if (type === 'both') {
    const s = pickOne(['big', 'small']), o = s === 'big' ? 'small' : 'big';
    gifts = [{ c: cols[0], s }, { c: cols[0], s: o }, { c: cols[1], s }, { c: cols[2], s: o }];
    t = gifts[0]; ask = `Give me the ${s} ${t.c} gift.`; say = `Here is the ${s} ${t.c} gift.`;
  } else {
    gifts = cols.slice(0, 3).map(c => ({ c, s: '' })); t = null;

  }
  return { gifts: shuffle(gifts), t, ask, say, type };
}

  let pairs = [], sel = null, busy = false, wrongs = new Set();
  const ctr = (el, side) => { const r = el.getBoundingClientRect(), br = board.getBoundingClientRect(); return [(side === 'L' ? r.right : r.left) - br.left, r.top + r.height / 2 - br.top]; };
  const line = (a, z, cls) => { const [x1, y1] = a, [x2, y2] = z; svg.insertAdjacentHTML('beforeend', `<line class="${cls}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`); return svg.lastChild; };
  function drawBoard() {
    pairs = boards[b]; sel = null; busy = false; wrongs = new Set();
    svg.innerHTML = '';
    colL.innerHTML = pairs.map((p, k) => `<button class="wit" data-k="${k}"><span>${p.le}</span><small>${esc(p.l)}</small></button>`).join('');
    const rs = shuffle(pairs.map((p, k) => k));
    colR.innerHTML = rs.map(k => `<button class="wit" data-k="${k}"><span>${pairs[k].re}</span><small>${esc(pairs[k].r)}</small></button>`).join('');
  }
  const tryPair = (lk, rEl) => {
    if (busy) return;
    const lEl = colL.querySelector(`[data-k="${lk}"]`), rk = +rEl.dataset.k, p = pairs[lk];
    if (lEl.classList.contains('done') || rEl.classList.contains('done')) return;
    const ln = line(ctr(lEl, 'L'), ctr(rEl, 'R'), 'wl');
    lEl.classList.remove('sel');
    if (rk === lk) {
      busy = true; ln.classList.add('ok'); lEl.classList.add('done'); rEl.classList.add('done'); sfx.ok(); hideCheer();
      done++; setDots(6, done);
      sFinishRound(ctx, p, wrongs.has(lk), p.say, () => {
        busy = false;
        if (done === 6) { sfx.win(); later(() => ctx.done(mistakes), 600); }
        else if (done === 3) { b = 1; drawBoard(); }
      });
    } else {
      ln.classList.add('bad'); later(() => ln.remove(), 600);
      mistakes++; wrongs.add(lk); sfx.no(); cheer([[`I ${p.l} with ${pairs[rk].r}?`, false, SRATE]]);
    }
  };
  board.addEventListener('pointerdown', e => {
    const l = e.target.closest('.wcol.L .wit'), r = e.target.closest('.wcol.R .wit');
    if (r && sel !== null) { tryPair(sel, r); sel = null; return; }
    if (!l || l.classList.contains('done') || busy) return;
    e.preventDefault();
    colL.querySelectorAll('.wit').forEach(x => x.classList.toggle('sel', x === l));
    sel = +l.dataset.k; speak(`I ${pairs[sel].l} with…`, SRATE);
    const start = ctr(l, 'L'); let ln = null;
    const move = ev => {
      const br = board.getBoundingClientRect();
      if (!ln) ln = line(start, start, 'wl drag');
      ln.setAttribute('x2', ev.clientX - br.left); ln.setAttribute('y2', ev.clientY - br.top);
    };
    const up = ev => {
      removeEventListener('pointermove', move); removeEventListener('pointerup', up); removeEventListener('pointercancel', up);
      if (!ln) return;           // a tap: wait for a tap on the right side
      ln.remove();
      const hit = [...colR.querySelectorAll('.wit')].find(x => { const rr = x.getBoundingClientRect(); return ev.clientX >= rr.left && ev.clientX <= rr.right && ev.clientY >= rr.top && ev.clientY <= rr.bottom; });
      if (hit) { tryPair(sel, hit); sel = null; }
    };
    addEventListener('pointermove', move); addEventListener('pointerup', up); addEventListener('pointercancel', up);
  });
  setDots(6, 0); drawBoard();
};

/* today: the child picks what really happened; the game turns it into sentences */
const PLACES = [
  ['🏞️', 'the park', ['played on the swing', 'rode my bike', 'flew a kite']], ['🏫', 'school', ['read books', 'sang songs', 'played with my friends']],
  ['🦁', 'the zoo', ['saw a lion', 'saw monkeys', 'ate ice cream']], ['🛒', 'the supermarket', ['bought milk', 'bought apples', 'helped my mom']],
  ['👵', "Grandma's house", ['ate dinner', 'played games', 'watched TV']], ['📚', 'the library', ['read a book', 'found a new book', 'listened to a story']],
  ['🏖️', 'the beach', ['made a sandcastle', 'swam in the sea', 'found shells']], ['🏊', 'the swimming pool', ['swam', 'played in the water', 'jumped in']]
];
const DO_E = { 'played on the swing': '🛝', 'rode my bike': '🚲', 'flew a kite': '🪁', 'read books': '📚', 'sang songs': '🎵', 'played with my friends': '🧑‍🤝‍🧑',
  'saw a lion': '🦁', 'saw monkeys': '🐒', 'ate ice cream': '🍦', 'bought milk': '🥛', 'bought apples': '🍎', 'helped my mom': '🤝', 'ate dinner': '🍛',
  'played games': '🎲', 'watched TV': '📺', 'read a book': '📖', 'found a new book': '🔎', 'listened to a story': '👂', 'made a sandcastle': '🏰',
  'swam in the sea': '🌊', 'found shells': '🐚', 'swam': '🏊', 'played in the water': '💦', 'jumped in': '🤸' };
const FEEL_PAST = [['😄', 'It was fun!'], ['🤩', 'It was great!'], ['😊', 'I was happy.'], ['😫', 'I was tired.']];
const withWho = () => {
  const { fam } = people(), ns = friendNames();
  return [...fam.map(f => [f.e, f.obj]), ...(ns.length ? ns.map(n => ['🧒', myFriend(n)]) : [['🧒', 'my friend']]), ['👨‍👩‍👧', 'my family']];
};
// one question, picture choices; resolves with [choice index]
function picAsk(ctx, host, q, choices, cb) {
  host.innerHTML = `<div class="sentrow"><div class="sentence">${esc(q)}</div><button class="say" aria-label="聽">🔊</button></div>
    <div class="picks">${choices.map(([e, t], k) => `<button class="pk" data-k="${k}"><span>${e}</span><small>${esc(t)}</small></button>`).join('')}</div>`;
  host.querySelector('.say').onclick = () => speak(q, SRATE);
  later(() => speak(q, SRATE), 300);
  let busy = false;
  host.querySelectorAll('.pk').forEach(b => b.onclick = () => { if (busy) return; busy = true; b.classList.add('right'); sfx.flip(); cb(+b.dataset.k); });
}
function saveDiary(lines) {
  const l = L(); l.diary = l.diary || [];
  l.diary.unshift({ date: todayStr(), lines }); l.diary = l.diary.slice(0, 20); save();
}
SGAMES.today = (ctx, def) => {
  let step = 0; const lines = [];
  ctx.stage.innerHTML = `<div class="todayg"><div class="tq"></div><div class="tstory"></div></div>`;
  const tq = ctx.stage.querySelector('.tq'), story = ctx.stage.querySelector('.tstory');
  const add = s => { lines.push(s); story.innerHTML = lines.map(x => `<p>${esc(x)}</p>`).join(''); };
  let place = null, who = null;
  const say = (s, next) => { ctx.learned.add(s); srec({ say: s }, false); later(() => sayAlong(s, next), 500); };
  setDots(5, 0);
  const qs = [
    () => { const ch = sample(PLACES, 6); picAsk(ctx, tq, pickOne(['Where did you go today?', 'Did you go anywhere today?', 'Where did you go?']), ch.map(p => [p[0], p[1]]), k => { place = ch[k]; next(`I went to ${place[1]}.`); }); },
    () => { const ch = withWho(); picAsk(ctx, tq, pickOne(['Who did you go with?', 'Who went with you?']), ch, k => { who = ch[k][1]; next(`I went with ${who}.`); }); },
    () => { const ch = place[2].map(d => [DO_E[d] || '⭐', d]); picAsk(ctx, tq, pickOne(['What did you do there?', 'What did you do?']), ch, k => next(`I ${ch[k][1]}.`)); },
    () => picAsk(ctx, tq, pickOne(['How was it?', 'How did you feel?']), FEEL_PAST, k => next(FEEL_PAST[k][1]))
  ];
  function next(s) { add(s); step++; setDots(5, step); say(s, ask); }
  function ask() {
    if (step < qs.length) { qs[step](); return; }
    const all = `Today I went to ${place[1]} with ${who}. ${lines[2]} ${lines[3]}`;
    tq.innerHTML = `<p class="sub">${zy('把今天的事一起說一次！')}</p>`;
    saveDiary([all]);
    setDots(5, 5); ctx.learned.add(all);
    later(() => sayAlong(all, () => { sfx.win(); later(() => ctx.done(0), 400); }), 600);
  }
  ask();
};

SGAMES.interview = (ctx, def) => {
  const lines = []; let mistakes = 0, step = 0;
  ctx.stage.innerHTML = `<div class="todayg intv"><div class="ihead"><span class="santaf">🎅</span><span class="mic">🎤</span></div><div class="tq"></div><div class="tstory"></div></div>`;
  const tq = ctx.stage.querySelector('.tq'), story = ctx.stage.querySelector('.tstory');
  const add = s => { lines.push(s); story.innerHTML = lines.map(x => `<p>${esc(x)}</p>`).join(''); };
  const said = (s, next) => { add(s); ctx.learned.add(s); later(() => sayAlong(s, next), 500); };
  const replyStep = turn => cb => {
    const [line] = turn.santa ? turn.santa() : [turn.ask];
    tq.innerHTML = `<div class="sentrow"><div class="sentence">${esc(turn.garble ? 'What… is… your…' : line)}</div><button class="say" aria-label="聽">🔊</button></div><div class="copts"></div>`;
    const play = () => { if (turn.garble) [300, 520, 760].forEach((f, k) => tone(f, k * .12, .1, 'sawtooth', .04)); else speak(line, SRATE); };
    tq.querySelector('.say').onclick = play; later(play, 300);
    const done = (w, s) => { srec({ say: s }, w); said(s, cb); };
    done.miss = () => { mistakes++; };
    replyPick(tq.querySelector('.copts'), turn, done);
  };
  const picStep = (q, choices, toSay) => cb => picAsk(ctx, tq, q, choices, k => said(toSay(k), cb));
  const name = enName(), names = friendNames(), who = withWho();
  const canCh = sample(CAN_ACTS, 4).map(a => [a[2], a[0]]), plCh = sample(PLACES, 4), feels = ['happy', 'excited', 'sleepy', 'tired'];
  const steps = [
    replyStep(CALL_TURNS.find(t => t.id === 'how')),
    ...(name ? [replyStep({ ask: 'What is your name?', good: [`My name is ${name}.`], short: `${name}.`, off: 'I am fine.' })] : []),
    picStep('How old are you?', [5, 6, 7, 8, 9, 10].map(n => ['🎂', String(n)]), k => `I am ${k + 5} years old.`),
    replyStep({ garble: true, ask: '', good: ['Can you say that again, please?'], short: 'Yes.', off: 'At the zoo.' }),
    names.length ? picStep('Who is your best friend?', names.map(n => ['🧒', n]), k => `My best friend is ${names[k]}.`)
                 : picStep('Who do you like to play with?', who, k => `I like to play with ${who[k][1]}.`),
    picStep('What can you do?', canCh, k => `I can ${canCh[k][1]}.`),
    picStep(pickOne(['Where did you go today?', 'Did you go anywhere today?']), plCh.map(p => [p[0], p[1]]), k => `I went to ${plCh[k][1]}.`),
    picStep(pickOne(['How do you feel now?', 'How are you feeling?']), feels.map(f => [FEELS[f], f]), k => `I feel ${feels[k]}.`)
  ];
  setDots(steps.length, 0);
  function go() {
    setDots(steps.length, step);
    if (step >= steps.length) return diary();
    steps[step++](go);
  }
  function diary() {
    saveDiary(lines.slice());
    tq.innerHTML = '';
    story.classList.add('diary');
    story.insertAdjacentHTML('afterbegin', `<h3>📔 My English Diary <small>${todayStr()}</small></h3>`);
    story.insertAdjacentHTML('beforeend', `<div class="row"><button class="btn alt" id="dRead">${zy('🔊 念給我聽')}</button><button class="btn" id="dDone">${zy('完成！')}</button></div>`);
    sfx.win(); speak('Great job! Here is your diary.', 0.9);
    $('#dRead').onclick = () => speakSeq(lines.map(s => [s, false, SRATE]));
    $('#dDone').onclick = () => ctx.done(mistakes);
  }
  go();
};

  };
  fillVoices();

  const trySay = () => speakPaced(zhParts('你好，我是小老師。說一個東西的時候，前面要加 a 或 an。'));
  $('#zhVoiceSel').onchange = e => { devPref('xmas-zh-voice', e.target.value || null); pickVoices(); trySay(); };
