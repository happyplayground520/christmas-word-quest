<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
</style>
<title>聖誕單字大冒險</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Iansui&family=Huninn&family=LXGW+WenKai+TC&family=Chiron+GoRound+TC:wght@700&family=Nunito:wght@700;800;900&family=Sniglet:wght@400;800&display=swap">
<style>
/* Layout: one-screen tablet game on a snowy night — world maps with lantern paths, chunky toy-like buttons, a cosy cabin to decorate. */
:root {
  --night: #0e1c3a;
  --night-2: #1b3263;
  --snow: #f5f8ff;
  --frost: #c9dcff;
  --frost-d: #8fb0e6;
  --gold: #ffc53d;
  --gold-l: #fff1c7;
  --gold-d: #c98a12;
  --berry: #e5484d;
  --berry-d: #a8272c;
  --pine: #2e9a68;
  --pine-d: #1d6b47;
  --ink: #13213f;
  --ink-2: #4a5a7d;
  --muted: #a9bde3;
  --locked: #34466f;
  --ice: #8cc4f0;
  --f-display: "Sniglet", "Iansui", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-body: "Iansui", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
  --f-word: "Andika", "Trebuchet MS", "Segoe UI", sans-serif;
  --f-num: "Nunito", "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden;
  background: radial-gradient(ellipse at 50% -10%, var(--night-2), var(--night) 70%);
  background-color: var(--night);
  color: var(--snow);
  font-family: var(--f-body);
  touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 4px solid var(--gold); outline-offset: 3px; }

/* 注音: each character followed by a small vertical bopomofo column, tone mark at its right */
.zy { display: inline-flex; align-items: center; vertical-align: middle; line-height: 1; margin-right: .1em; }
.zy .b {
  display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
  margin-left: .06em; font-family: var(--f-body); font-weight: 400;
  font-size: max(.36em, 11px); line-height: 1.02; letter-spacing: 0; text-shadow: none;
}
.zy .b > span { position: relative; display: block; }
.zy .t { position: absolute; left: 92%; top: -.45em; font-size: 1em; }
.zy .lt { line-height: .7; }

#snow { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
#app {
  position: relative; z-index: 1; height: 100%;
  display: flex; flex-direction: column; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
}
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; }
.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; }

/* ---------- chunky buttons ---------- */
.btn {
  border: none; border-radius: 20px; min-height: 60px; padding: 10px 26px;
  font-family: var(--f-body); font-size: 22px; font-weight: 700;
  background: var(--gold); color: var(--ink);
  box-shadow: 0 6px 0 var(--gold-d);
  transition: transform .08s, box-shadow .08s;
}
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--gold-d); }
.btn.alt { background: var(--snow); box-shadow: 0 6px 0 var(--frost-d); }
.btn.alt:active { box-shadow: 0 2px 0 var(--frost-d); }
.btn.red { background: var(--berry); color: #fff; box-shadow: 0 6px 0 var(--berry-d); }
.btn:disabled { opacity: .45; cursor: default; }

/* ---------- top bar ---------- */
.bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spacer { flex: 1; }
.chip {
  border: none; display: inline-flex; align-items: center; gap: 6px;
  min-height: 48px; padding: 6px 16px; border-radius: 999px;
  background: rgba(27,50,99,.88); color: var(--snow);
  font-size: 19px; font-weight: 700; white-space: nowrap;
}
button.chip:active { background: var(--night-2); }
.chip b { color: var(--gold); font-family: var(--f-num); font-weight: 900; font-size: 22px; font-variant-numeric: tabular-nums; }

/* ---------- profiles ---------- */
#profiles { align-items: center; justify-content: safe center; text-align: center; gap: 22px; }
.ptitle { margin: 0; font-family: var(--f-display); font-size: clamp(34px, 6vmin, 56px); text-shadow: 0 5px 0 var(--berry-d); }
.plist { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; width: 100%; max-width: 900px; }
.pcard {
  width: 180px; border: none; border-radius: 28px; padding: 16px 10px 14px;
  background: var(--snow); color: var(--ink); box-shadow: 0 7px 0 var(--frost-d);
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.pcard .pe { font-size: 62px; line-height: 1.1; }
.genders { display: flex; gap: 14px; justify-content: center; }
.gpick { border: 3px solid var(--frost); border-radius: 22px; background: #fff; color: var(--ink); padding: 8px 22px 10px; font-size: 20px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.gpick .gi { font-size: 52px; line-height: 1.1; }
.gpick.on { border-color: var(--berry); background: #ffe9ea; box-shadow: 0 0 0 3px rgba(229,72,77,.25); }
.pcard b { font-size: 24px; }
.pcard small { color: var(--ink-2); font-size: 16px; }
.pcard.add { background: transparent; color: var(--snow); border: 3px dashed rgba(245,248,255,.5); box-shadow: none; justify-content: center; min-height: 190px; font-size: 22px; font-weight: 700; }

/* ---------- home: mission on top, versions centred, tools in a side rail, buddy in the corner ---------- */
#home { position: relative; }
.homewrap { position: relative; flex: 1; min-height: 0; display: flex; padding-left: 92px; }
/* the rail floats over the page, so opening it never pushes the content around */
.side {
  position: absolute; left: 0; top: 0; bottom: 0; z-index: 3;
  width: 76px; display: flex; flex-direction: column; gap: 8px; padding: 10px 8px;
  border-radius: 26px; background: rgba(14,28,58,.75); border: 2px solid rgba(245,248,255,.12);
  transition: width .25s ease; overflow: hidden;
}
.side.open { width: 236px; background: rgba(14,28,58,.97); box-shadow: 10px 0 28px rgba(0,0,0,.4); }
.sbtn {
  position: relative; border: none; border-radius: 18px; min-height: 58px; padding: 6px 8px;
  display: flex; align-items: center; gap: 10px; background: transparent; color: var(--snow);
  font-size: 18px; font-weight: 700; white-space: nowrap; text-align: left;
}
.sbtn:hover, .sbtn:active { background: rgba(245,248,255,.12); }
.sbtn .si2 { flex: none; width: 44px; text-align: center; font-size: 30px; line-height: 1; }
.sbtn .sl { display: none; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.side.open .sbtn .sl { display: inline; }
.sbtn .dot { position: absolute; top: 8px; left: 42px; width: 13px; height: 13px; border-radius: 50%; background: var(--berry); box-shadow: 0 0 0 2px var(--night); }
.sbtn.glow .si2 { animation: pulse 1.6s ease-in-out infinite; }
.side .sep { flex: 1; }
.homemain {
  flex: 1; min-width: 0; overflow-y: auto; display: flex; flex-direction: column; align-items: center;
  gap: clamp(14px, 3.5vh, 30px); padding-bottom: 130px;
}
.mission {
  width: 100%; display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; padding: 12px 16px;
  border-radius: 22px; background: rgba(245,248,255,.1); border: 2px solid rgba(245,248,255,.14);
}
.mission .mi { font-size: 34px; line-height: 1; }
.mission .mtext { flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.mission .mtext b { font-size: 20px; color: var(--gold); }
.mission .mtext small { color: var(--frost); font-size: 16px; }
.mission .bar-prog { flex: 1 1 140px; max-width: 240px; }
.bar-prog { height: 14px; border-radius: 999px; background: rgba(245,248,255,.15); overflow: hidden; }
.bar-prog i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), #ffe08a); border-radius: inherit; }
.htitle { margin: 0; text-align: center; font-family: var(--f-display); font-weight: 800; font-size: clamp(34px, 6.5vmin, 68px); line-height: 1.05; text-shadow: 0 5px 0 var(--berry-d), 0 0 30px rgba(255,197,61,.3); }
.vers { width: min(720px, 100%); display: flex; flex-direction: column; gap: 14px; }
.vbtn {
  border: none; border-radius: 26px; padding: 14px 18px; text-align: left;
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 14px;
  background: var(--snow); color: var(--ink); box-shadow: 0 7px 0 var(--frost-d);
}
.vbtn:active { transform: translateY(4px); box-shadow: 0 3px 0 var(--frost-d); }
.vbtn .vi { font-size: 48px; }
.vbtn b { font-family: var(--f-display); font-size: 28px; display: block; }
.vbtn small { color: var(--ink-2); font-size: 17px; }
.vbtn .vs { color: var(--gold-d); font-weight: 700; font-size: 18px; white-space: nowrap; }
.vcard { display: flex; gap: 10px; align-items: stretch; }
.vcard .vbtn { flex: 1; min-width: 0; }
.vgo {
  flex: none; border: none; border-radius: 22px; padding: 8px 16px; min-width: 126px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  background: var(--berry); color: #fff; box-shadow: 0 7px 0 var(--berry-d);
}
.vgo:active { transform: translateY(4px); box-shadow: 0 3px 0 var(--berry-d); }
.vgo b { font-size: 21px; }
.vgo small { font-size: 15px; font-weight: 700; color: #ffe0e1; white-space: nowrap; }
.vgo.done { background: rgba(14,28,58,.75); box-shadow: none; color: var(--gold); font-weight: 700; font-size: 17px; }
.vbtn[data-v="adv"] { background: #e6f6ee; box-shadow: 0 7px 0 #8fc9a8; }
.vbtn[data-v="pro"] { background: var(--gold-l); box-shadow: 0 7px 0 var(--gold-d); }
.chest {
  width: min(720px, 100%); border: none; border-radius: 24px; padding: 12px 18px; text-align: left;
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 14px;
  background: rgba(14,28,58,.82); color: var(--snow); border: 2px solid rgba(255,197,61,.45);
}
.chest .ci { font-size: 44px; line-height: 1; }
.chest .ct { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.chest .ct b { font-size: 19px; color: var(--gold); }
.chest .ct small { font-size: 15px; color: var(--frost); }
.chest .cs { font-family: var(--f-num); font-weight: 900; font-size: 24px; color: var(--gold); white-space: nowrap; }
.chest.ready { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(255,197,61,.35), 0 0 26px rgba(255,197,61,.45); }
.chest.ready .ci { animation: pulse 1.2s ease-in-out infinite; }
.buddyfab {
  position: absolute; right: 0; bottom: 0; width: 156px; height: 158px; padding: 0; border: none; background: none;
  filter: drop-shadow(0 6px 8px rgba(0,0,0,.35));
}
.buddyfab .bw { display: block; width: 100%; height: 100%; transform: scale(var(--s, 1)); transform-origin: bottom center; }
.buddyfab svg { width: 100%; height: 100%; display: block; animation: idle 2.6s ease-in-out infinite; }
.buddyfab.hop svg { animation: hop .5s; }
@keyframes idle { 50% { transform: translateY(-5px); } }
@keyframes hop { 40% { transform: translateY(-26px) scale(1.06); } }
.eye { transform-box: fill-box; transform-origin: center; animation: blink 4.2s infinite; }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
.bbubble {
  position: absolute; right: 18px; bottom: 166px; width: min(320px, calc(100% - 32px));
  display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border-radius: 22px;
  background: var(--snow); color: var(--ink); box-shadow: 0 6px 0 var(--frost-d);
  transform-origin: bottom right; animation: bubin .3s cubic-bezier(.3,1.6,.5,1);
}
.bbubble::after { content: ""; position: absolute; right: 50px; bottom: -12px; border: 12px solid transparent; border-bottom: 0; border-top-color: var(--snow); }
.bbubble b { font-size: 22px; }
.bbubble p { margin: 0; font-size: 18px; color: var(--ink-2); }
.bbubble .bar-prog { background: #dfe7f5; }
.friends { display: flex; gap: 6px; }
.friends svg { width: 44px; height: 44px; }
@keyframes bubin { from { transform: scale(.4); opacity: 0; } }

/* ---------- world map ---------- */
.wtabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.wtab {
  flex: 1 0 auto; border: none; border-radius: 18px; min-height: 56px; padding: 6px 12px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: rgba(27,50,99,.88); color: var(--snow); font-size: 17px; font-weight: 700; white-space: nowrap;
}
.wtab .wi { font-size: 26px; }
.wtab.on { background: var(--snow); color: var(--ink); box-shadow: 0 4px 0 var(--frost-d); }
.wtab.locked { opacity: .55; }
.wtab.locked .wi { filter: grayscale(1); }
.mapnote {
  margin: 0; align-self: center; max-width: 100%; padding: 5px 18px; border-radius: 999px;
  background: rgba(14,28,58,.84); font-size: clamp(16px, 2.4vmin, 21px); color: var(--snow); text-align: center; text-wrap: balance;
}
.mapwrap { flex: 1; min-height: 0; display: grid; place-items: center; container-type: size; }
.map { position: relative; aspect-ratio: 5 / 3; width: min(100cqw, 100cqh * 5 / 3); max-width: 100%; }
@media (orientation: portrait) { .map { aspect-ratio: 3 / 4; width: min(100cqw, 100cqh * 3 / 4); } }
.map svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.trail-todo { fill: none; stroke: rgba(245,248,255,.55); stroke-width: 6; stroke-linecap: round; stroke-dasharray: 1 14; }
.trail-done { fill: none; stroke: var(--gold); stroke-width: 10; stroke-linecap: round; filter: drop-shadow(0 0 5px rgba(255,197,61,.85)); }
.elfmark {
  position: absolute; left: var(--x); top: var(--y); z-index: 2; pointer-events: none;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  transform: translate(-50%, calc(-100% - 6vmin - 44px));  /* clear the orb, which sits above the node centre */
}
.elfmark .elf { font-size: clamp(34px, 6.5vmin, 56px); line-height: 1; filter: drop-shadow(0 4px 4px rgba(0,0,0,.4)); animation: elfhop 1.1s ease-in-out infinite; }
.elfmark .flag { padding: 2px 10px; border-radius: 999px; background: var(--gold); color: var(--ink); font-weight: 700; font-size: clamp(13px, 2.1vmin, 17px); white-space: nowrap; box-shadow: 0 3px 0 var(--gold-d); }
@keyframes elfhop { 50% { transform: translateY(-8px); } }
.wtab .wprog { font-family: var(--f-num); font-weight: 800; font-size: 14px; padding: 1px 8px; border-radius: 999px; background: rgba(0,0,0,.28); }
.wtab.on .wprog { background: rgba(19,33,63,.12); }
.wtab .here { font-size: 22px; line-height: 1; }
.trail { fill: none; stroke: var(--gold); stroke-width: 7; stroke-linecap: round; stroke-dasharray: 1 16; opacity: .9; }
.branch { fill: none; stroke: var(--snow); stroke-width: 5; stroke-linecap: round; stroke-dasharray: 2 12; opacity: .7; }
.station {
  position: absolute; left: var(--x); top: var(--y); transform: translate(-50%, -50%);
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  background: none; border: none; padding: 0; width: max-content;
}
.orb {
  position: relative; width: clamp(64px, 12vmin, 108px); aspect-ratio: 1; border-radius: 50%;
  display: grid; place-items: center; font-size: clamp(30px, 6vmin, 54px);
  background: var(--snow); box-shadow: 0 6px 0 var(--frost-d);
}
.orb .num { position: absolute; top: -8px; left: -8px; font-family: var(--f-num); font-weight: 900; font-size: clamp(14px, 2.2vmin, 18px); background: var(--berry); color: #fff; border-radius: 999px; padding: 2px 8px; }
.station.gate .orb { background: #dff0ff; box-shadow: 0 6px 0 #5f93c4, 0 0 0 4px var(--ice); }
.station.sidequest .orb { width: clamp(56px, 10vmin, 90px); background: var(--gold-l); box-shadow: 0 5px 0 var(--gold-d); outline: 3px dashed var(--gold); outline-offset: 5px; }
.station.locked .orb { background: var(--locked); box-shadow: 0 6px 0 #232f4d; outline-color: rgba(245,248,255,.3); }
.station.locked .orb .ico { filter: grayscale(1); opacity: .35; }
.station.locked .orb::after { content: "🔒"; position: absolute; font-size: .55em; right: -4%; bottom: -4%; }
.station.next .orb { box-shadow: 0 6px 0 var(--gold-d), 0 0 0 6px var(--gold); animation: pulse 1.6s ease-in-out infinite; }
.station.done .orb { box-shadow: 0 6px 0 var(--gold-d), 0 0 34px 8px rgba(255,197,61,.55); }
.station.done .orb::before {
  content: "✓"; position: absolute; right: -8%; top: -8%; width: 30px; height: 30px; border-radius: 50%;
  display: grid; place-items: center; background: var(--pine); color: #fff; font: 900 18px/1 var(--f-num); box-shadow: 0 2px 0 var(--pine-d);
}
.station.locked { transform: translate(-50%, -50%) scale(.86); }
.station.locked .name { opacity: .75; }
.station.next .name { background: var(--gold); color: var(--ink); }
.station .name {
  font-weight: 700; font-size: clamp(13px, 2.2vmin, 18px);
  background: rgba(14,28,58,.84); padding: 3px 12px; border-radius: 999px; white-space: nowrap;
}
.station .st { color: var(--gold); font-size: clamp(14px, 2.2vmin, 19px); letter-spacing: 2px; line-height: 1; min-height: 1em; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
.station .st i { font-style: normal; color: rgba(245,248,255,.35); }
.station .cond { font-size: clamp(12px, 2vmin, 16px); color: var(--gold-l); background: rgba(14,28,58,.84); padding: 2px 10px; border-radius: 999px; }
.mbuddy { position: absolute; left: 1%; bottom: 0; width: clamp(54px, 10vmin, 90px); filter: drop-shadow(0 4px 6px rgba(0,0,0,.4)); }
.mbuddy svg, .rgrow .ge svg, .remind .re svg { width: 100%; height: 100%; display: block; }
@keyframes pulse { 50% { transform: scale(1.06); } }

/* ---------- game shell ---------- */
.ghead { display: flex; align-items: center; gap: 14px; }
.tomap {
  flex: none; display: inline-flex; align-items: center; gap: 6px;
  min-height: 60px; padding: 6px 20px 6px 14px; border: none; border-radius: 999px;
  background: var(--snow); color: var(--ink); font-size: 22px; font-weight: 700;
  box-shadow: 0 5px 0 var(--frost-d);
}
.tomap:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--frost-d); }
.tomap-ico { font-size: 30px; line-height: 1; }
.gtitle { flex: 1; min-width: 0; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
.gtitle h2 { margin: 0; font-family: var(--f-display); font-size: clamp(22px, 3.4vmin, 30px); }
.gtitle p { margin: 2px 0 0; color: var(--frost); font-size: clamp(15px, 2.3vmin, 19px); }
.dots { display: flex; gap: 7px; flex-wrap: wrap; justify-content: flex-end; max-width: 45%; }
.dots i { width: 16px; height: 16px; border-radius: 50%; background: rgba(245,248,255,.25); }
.dots i.on { background: var(--gold); box-shadow: 0 0 10px var(--gold); }
.stage { flex: 1; min-height: 0; display: grid; place-items: center; container-type: size; }
.stage, .bossq { grid-template-columns: minmax(0, 1fr); }

/* faces: emoji or a wrapped gift box in a colour */
.emo { line-height: 1; }
.gift {
  display: inline-block; width: 1em; height: .92em; position: relative; border-radius: .14em;
  background: var(--g); box-shadow: inset 0 -.12em 0 rgba(0,0,0,.18), 0 .04em 0 rgba(0,0,0,.25), 0 0 0 .03em rgba(255,255,255,.35);
}
.gift::before, .gift::after { content: ""; position: absolute; background: var(--r); }
.gift::before { left: 50%; top: 0; bottom: 0; width: .16em; transform: translateX(-50%); }
.gift::after { top: 42%; left: 0; right: 0; height: .16em; }

/* ---------- quiz ---------- */
.quiz { width: 100%; max-width: 920px; display: flex; flex-direction: column; align-items: center; gap: clamp(14px, 5cqh, 40px); }
.prompt { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.say {
  flex: none; border: none; border-radius: 50%; background: var(--berry); color: #fff;
  box-shadow: 0 7px 0 var(--berry-d);
  display: flex; align-items: center; justify-content: center;
  width: clamp(72px, 16cqh, 110px); height: clamp(72px, 16cqh, 110px); font-size: clamp(30px, 7cqh, 44px);
}
.say:active { transform: translateY(4px); box-shadow: 0 3px 0 var(--berry-d); }
.say.wiggle { animation: shake .5s 2; }
.ask { display: flex; align-items: center; justify-content: center; gap: clamp(14px, 3vw, 28px); flex-wrap: wrap; }
.word-prompt {
  white-space: nowrap; border: none; font-family: var(--f-word); font-weight: 700; font-size: clamp(44px, 12cqh, 84px);
  background: var(--snow); color: var(--ink); padding: 4px 36px 10px; border-radius: 26px;
  box-shadow: 0 8px 0 var(--frost-d);
}
.sub { margin: 4px 0 0; padding: 4px 16px; border-radius: 999px; background: rgba(14,28,58,.84); color: var(--snow); font-size: 19px; }
.opts { display: flex; gap: clamp(10px, 2.4vw, 22px); justify-content: center; width: 100%; }
.opt {
  flex: 1 1 0; min-width: 0; max-width: min(210px, 34cqh); aspect-ratio: 1;
  border: none; border-radius: 28px; background: var(--snow); color: var(--ink);
  font-size: clamp(46px, 14cqh, 106px);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  box-shadow: 0 8px 0 var(--frost-d); transition: transform .15s, opacity .2s;
}
.opt .lbl { font-family: var(--f-word); font-weight: 700; font-size: clamp(15px, 4.4cqh, 24px); height: 1.2em; opacity: 0; white-space: nowrap; }
.opt.right { background: var(--gold-l); transform: scale(1.07); box-shadow: 0 8px 0 var(--gold-d), 0 0 0 6px var(--gold); }
.opt.right .lbl { opacity: 1; }
.opt.wrong { animation: shake .4s; opacity: .4; }
@keyframes shake { 20%, 60% { transform: translateX(-10px) rotate(-3deg); } 40%, 80% { transform: translateX(10px) rotate(3deg); } }

/* ---------- memory ---------- */
.memory { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(8px, 2cqh, 16px); width: min(100cqw, 140cqh, 780px); }
.memory.rows3 { width: min(100cqw, 92cqh, 700px); }
.mcard { position: relative; aspect-ratio: 3 / 4; border: none; background: none; padding: 0; perspective: 900px; }
.mcard > span {
  position: absolute; inset: 0; border-radius: 20px; display: grid; place-items: center;
  backface-visibility: hidden; -webkit-backface-visibility: hidden; transition: transform .35s;
}
.back {
  background: repeating-linear-gradient(45deg, var(--pine) 0 14px, var(--pine-d) 14px 28px);
  box-shadow: 0 6px 0 #124530, inset 0 0 0 5px rgba(255,255,255,.18);
  color: rgba(245,248,255,.85); font-size: clamp(26px, 7cqh, 48px);
}
.front {
  background: var(--snow); color: var(--ink); transform: rotateY(180deg);
  box-shadow: 0 6px 0 var(--frost-d); font-size: clamp(34px, 10cqh, 80px);
}
.mcard.open .back { transform: rotateY(180deg); }
.mcard.open .front { transform: rotateY(0); }
.mcard.matched .front { background: var(--gold-l); box-shadow: 0 6px 0 var(--gold-d), 0 0 0 5px var(--gold); }
.mword { font-family: var(--f-word); font-weight: 700; font-size: clamp(16px, 5cqh, 32px); padding: 0 6px; text-align: center; overflow-wrap: anywhere; }

/* ---------- colour gifts ---------- */
.colors { width: 100%; height: 100%; display: flex; flex-direction: column; gap: 12px; }
.cprompt { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; font-size: clamp(19px, 3vmin, 26px); font-weight: 700; text-shadow: 0 2px 4px rgba(0,0,0,.6); }
.cprompt .say { width: 64px; height: 64px; font-size: 28px; }
.cword { font-family: var(--f-word); font-size: clamp(34px, 6vmin, 50px); background: var(--snow); color: var(--ink); padding: 0 20px 4px; border-radius: 16px; text-shadow: none; }
.pips { display: inline-flex; gap: 6px; }
.pips i { width: 22px; height: 22px; border-radius: 6px; background: rgba(245,248,255,.25); }
.pips i.on { background: var(--gold); box-shadow: 0 0 10px var(--gold); }
.sky {
  flex: 1; position: relative; overflow: hidden; border-radius: 28px;
  background: linear-gradient(rgba(27,50,99,.55), rgba(245,248,255,.08));
  border: 2px solid rgba(245,248,255,.18);
}
.fall {
  position: absolute; top: -20%; border: none; background: none; padding: 16px;
  font-size: clamp(52px, 11vmin, 88px); touch-action: none;
  animation-name: fall; animation-timing-function: linear; animation-fill-mode: forwards;
}
.fall .in { display: block; }
.fall .in.wob { animation: shake .4s; }
.fall.pop { animation-play-state: paused; }
.fall.pop .in { animation: pop .45s forwards; }
.fall .tag {
  position: absolute; left: 50%; top: 86%; transform: translateX(-50%);
  font-family: var(--f-word); font-weight: 700; font-size: clamp(20px, 3.4vmin, 28px); line-height: 1.2;
  background: var(--snow); color: var(--ink); padding: 0 12px 2px; border-radius: 12px;
  white-space: nowrap; pointer-events: none; animation: popin .3s;
}
@keyframes fall { from { top: -20%; } to { top: 104%; } }
@keyframes pop { 40% { transform: scale(1.35); } 100% { transform: scale(0); opacity: 0; } }

/* ---------- spelling & word cards ---------- */
.spell { display: flex; flex-direction: column; align-items: center; gap: clamp(10px, 3.5cqh, 30px); }
.pic {
  position: relative; border: none; width: clamp(120px, 32cqh, 210px); aspect-ratio: 1; border-radius: 32px;
  background: var(--snow); color: var(--ink); font-size: clamp(64px, 19cqh, 130px);
  display: grid; place-items: center; box-shadow: 0 8px 0 var(--frost-d);
}
.pic small { position: absolute; right: 12px; bottom: 8px; font-size: 26px; }
.slots { display: flex; gap: clamp(4px, 1.2vw, 12px); flex-wrap: wrap; justify-content: center; }
.slot {
  font-family: var(--f-word); font-weight: 700; font-size: clamp(36px, 10cqh, 68px);
  width: 1.1em; height: 1.45em; display: grid; place-items: center;
  border-bottom: 5px solid var(--frost); color: var(--snow); text-shadow: 0 2px 4px rgba(0,0,0,.5);
}
.slot.blank { border: 4px dashed rgba(255,197,61,.6); border-radius: 14px; background: rgba(255,197,61,.1); }
.slot.blank.cur { border-color: var(--gold); background: rgba(255,197,61,.25); }
.slot.filled { color: var(--gold); border-style: solid; animation: popin .4s; }
@keyframes popin { 0% { transform: scale(.3); } 70% { transform: scale(1.2); } }
.flakes { display: flex; gap: clamp(12px, 3.5vw, 30px); flex-wrap: wrap; justify-content: center; }
.flake {
  position: relative; border: none; border-radius: 50%;
  width: clamp(78px, 20cqh, 124px); aspect-ratio: 1;
  background: radial-gradient(circle at 35% 30%, #fff, var(--frost) 75%);
  box-shadow: 0 7px 0 var(--frost-d);
  font-family: var(--f-word); font-weight: 700; font-size: clamp(36px, 10cqh, 62px); color: var(--ink);
}
.flake::before { content: "❄"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 1.7em; color: rgba(143,176,230,.4); }
.flake span { position: relative; }
.flake:active { transform: translateY(4px); box-shadow: 0 3px 0 var(--frost-d); }
.flake.wrong { animation: shake .4s; opacity: .4; }
.flake.used { visibility: hidden; }

/* ---------- sentence fill-in ---------- */
.gram { width: 100%; max-width: 940px; display: flex; flex-direction: column; align-items: center; gap: clamp(10px, 3.5cqh, 30px); }
.gv {
  font-size: clamp(60px, 17cqh, 128px); line-height: 1; min-height: 1.25em;
  display: flex; align-items: flex-end; justify-content: center; gap: .08em;
  background: rgba(245,248,255,.92); color: var(--ink); border-radius: 28px; padding: .12em .3em;
  box-shadow: 0 7px 0 var(--frost-d);
}
.prep { position: relative; width: 1.5em; height: 1.95em; }
.prep > span { position: absolute; left: 50%; transform: translateX(-50%); line-height: 1; }
.prep .g-box { z-index: 2; }
.prep .g-who { z-index: 1; font-size: .6em; }
.p-on .g-box { bottom: 0; } .p-on .g-who { bottom: 50%; }
.p-under .g-box { bottom: 42%; } .p-under .g-who { bottom: 0; }
.p-in .g-box { bottom: 0; } .p-in .g-who { bottom: 40%; }
.tt { display: flex; align-items: flex-end; width: 3.6em; }
.tt .g-obj { font-size: .8em; }
.tt .g-pt { font-size: .45em; align-self: center; }
.tt.far .g-obj { font-size: .42em; margin-left: auto; align-self: flex-start; }
.sentrow { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; justify-content: center; }
.sentrow .say { width: 70px; height: 70px; font-size: 30px; }
.sentence {
  font-family: var(--f-word); font-weight: 700; font-size: clamp(28px, 7.5cqh, 52px); line-height: 1.25;
  background: var(--snow); color: var(--ink); padding: 8px 26px 12px; border-radius: 22px;
  box-shadow: 0 7px 0 var(--frost-d); text-align: center; max-width: 100%;
}
.gblank { display: inline-block; min-width: 2.4em; border-bottom: 5px solid var(--gold-d); color: var(--berry-d); }
.gblank.filled { animation: popin .4s; }
.wopts { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
.wbtn {
  border: none; font-family: var(--f-word); font-weight: 700; font-size: clamp(30px, 8cqh, 50px);
  min-width: 3em; padding: 8px 26px 12px; border-radius: 22px;
  background: var(--gold-l); color: var(--ink); box-shadow: 0 7px 0 var(--gold-d);
}
.wbtn:active { transform: translateY(4px); box-shadow: 0 3px 0 var(--gold-d); }
.wbtn.right { background: var(--gold); box-shadow: 0 7px 0 var(--gold-d), 0 0 0 5px var(--snow); }
.wbtn.wrong { animation: shake .4s; opacity: .4; }

/* ---------- boss: tree / ice door / snow tower ---------- */
.boss { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; gap: clamp(12px, 3vw, 36px); }
.treebox, .doorbox, .towerbox { flex: none; height: min(100%, 470px); aspect-ratio: 200 / 260; }
.treebox svg, .doorbox svg { width: 100%; height: 100%; display: block; }
.bossq { flex: 1; min-width: 0; max-width: 640px; height: 100%; display: grid; place-items: center; container-type: size; }
@media (orientation: portrait) {
  .boss { flex-direction: column; }
  .treebox, .doorbox, .towerbox { height: 32%; }
  .bossq { width: 100%; flex: 1; }
}
.t-leaf { fill: var(--pine); }
.t-leaf.d { fill: var(--pine-d); }
.t-trunk { fill: #7a4b2a; }
.t-star { fill: rgba(245,248,255,.25); transition: fill .4s; transform-origin: 100px 22px; }
.orn { transform-box: fill-box; transform-origin: center; transform: scale(0); transition: transform .45s cubic-bezier(.3,1.8,.5,1); }
.orn.on { transform: scale(1); }
.lit .t-star { fill: var(--gold); animation: twinkle 1s ease-in-out infinite; filter: drop-shadow(0 0 10px var(--gold)); }
.lit .orn { filter: drop-shadow(0 0 6px rgba(255,241,199,.9)); }
@keyframes twinkle { 50% { transform: scale(1.18) rotate(8deg); } }
.crack { opacity: 0; transition: opacity .3s; }
.crack.on { opacity: 1; }
.doorbox svg { overflow: visible; }
.doorbox.shake svg { animation: shake .4s; }
.doorbox .shards, .doorbox .nexti { display: none; }
.doorbox.break .whole { display: none; }
.doorbox.break .shards, .doorbox.break .nexti { display: inline; }
.shard { transform-box: fill-box; transform-origin: center; animation: shardfly 1s cubic-bezier(.2,.7,.4,1) both; }
@keyframes shardfly { to { transform: translate(var(--dx), var(--dy)) rotate(var(--r)) scale(.55); opacity: 0; } }
.flash { opacity: 0; pointer-events: none; }
.doorbox.break .flash { animation: flash .5s ease-out; }
@keyframes flash { from { opacity: .95; } to { opacity: 0; } }
.nexti { transform-box: fill-box; transform-origin: center; animation: nextin .7s .55s cubic-bezier(.3,1.6,.5,1) both; }
@keyframes nextin { from { transform: scale(.2); opacity: 0; } }
.towerbox { display: flex; flex-direction: column-reverse; align-items: center; justify-content: flex-start; gap: 0; padding-bottom: 6px; }
.towerbox .ball { width: var(--s); aspect-ratio: 1; border-radius: 50%; margin-top: calc(var(--s) * -.12); background: radial-gradient(circle at 35% 30%, #fff, #cfe0f7 75%); box-shadow: 0 4px 0 #8fb0e6; animation: popin .35s; }
.towerbox .ball.fall { animation: dropoff .5s forwards; }
@keyframes dropoff { to { transform: translate(60px, 80px) rotate(40deg); opacity: 0; } }
.towerbox .tcount { font-family: var(--f-num); font-weight: 900; font-size: 28px; color: var(--gold); margin-top: 8px; text-shadow: 0 2px 4px rgba(0,0,0,.6); }

/* ---------- world bosses and new stages ---------- */
.say.big { width: clamp(100px, 22cqh, 150px); height: clamp(100px, 22cqh, 150px); font-size: clamp(42px, 9cqh, 62px); }
.finale { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
.finale .doorbox { height: min(78%, 460px); }
.robotbox { flex: none; height: min(100%, 470px); aspect-ratio: 200 / 260; }
.robotbox svg { width: 100%; height: 100%; display: block; overflow: visible; }
.rp { opacity: 0; transform-box: fill-box; transform-origin: center; transform: scale(.3); transition: opacity .3s, transform .45s cubic-bezier(.3,1.7,.5,1); }
.rp.on { opacity: 1; transform: scale(1); }
.robotbox.dance svg { animation: dance .5s ease-in-out 4; }
@keyframes dance { 25% { transform: rotate(-8deg) translateY(-6px); } 75% { transform: rotate(8deg) translateY(-6px); } }
@media (orientation: portrait) { .robotbox { height: 32%; } }
.bingo { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; gap: clamp(16px, 4vw, 48px); }
.bcall { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.bgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(8px, 1.6cqh, 14px); width: min(88cqh, 60cqw, 560px); }
.bcell { position: relative; aspect-ratio: 1; border: none; border-radius: 20px; background: var(--snow); color: var(--ink); font-size: clamp(36px, 11cqh, 76px); box-shadow: 0 6px 0 var(--frost-d); }
.bcell.marked { background: var(--gold-l); box-shadow: 0 6px 0 var(--gold-d); }
.bcell.marked::after { content: "⭐"; position: absolute; right: 6%; top: 4%; font-size: .45em; animation: popin .4s; }
.bcell.win { box-shadow: 0 6px 0 var(--gold-d), 0 0 0 5px var(--gold), 0 0 24px rgba(255,197,61,.7); animation: pulse .8s ease-in-out 3; }
.bcell.wrong { animation: shake .4s; }
@media (orientation: portrait) { .bingo { flex-direction: column; } .bgrid { width: min(92cqw, 58cqh); } }
.battle { width: 100%; height: 100%; display: flex; flex-direction: column; gap: 8px; }
.arena { position: relative; flex: 0 0 38%; display: flex; align-items: center; justify-content: space-between; padding: 0 6%; }
.arena .me { font-size: clamp(56px, 12vmin, 104px); line-height: 1; filter: drop-shadow(0 6px 6px rgba(0,0,0,.35)); }
.foe { position: relative; height: 100%; aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
.foe svg { width: 82%; flex: 1; min-height: 0; }
.foe .fname { padding: 2px 12px; border-radius: 999px; background: rgba(14,28,58,.84); font-size: 16px; font-weight: 700; }
.foe.hit svg { animation: shake .35s; filter: brightness(1.3); }
.foe.flee { animation: flee 1.2s ease-in forwards; }
@keyframes flee { to { transform: translate(60vw, -20vh) rotate(30deg) scale(.4); opacity: 0; } }
.hp { display: flex; gap: 4px; margin-bottom: 4px; }
.hp i { width: 16px; height: 16px; border-radius: 50%; background: rgba(245,248,255,.25); }
.hp i.on { background: var(--berry); box-shadow: 0 0 6px var(--berry); }
.sball { position: absolute; left: 16%; top: 50%; width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #cfe0f7); box-shadow: 0 3px 6px rgba(0,0,0,.3); }
.sball.fly { animation: throw .6s ease-out forwards; }
@keyframes throw { 0% { left: 16%; top: 50%; } 50% { top: 15%; } 100% { left: 74%; top: 42%; } }
.bq { flex: 1; min-height: 0; display: grid; place-items: center; container-type: size; grid-template-columns: minmax(0, 1fr); }
.whack { width: 100%; max-width: 900px; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(10px, 3cqh, 24px); }
.wprompt { display: flex; align-items: center; gap: 14px; }
.wprompt .say { width: 70px; height: 70px; font-size: 30px; }
.holes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(10px, 2.5vw, 26px); width: 100%; }
.hole { position: relative; height: clamp(120px, 31cqh, 210px); overflow: hidden; }
.chim { position: absolute; left: 30%; right: 30%; bottom: 0; height: 30%; z-index: 2; border-radius: 6px 6px 0 0;
  background: repeating-linear-gradient(0deg, #7a3b33 0 14px, #5e2c26 14px 16px); border-top: 12px solid #eef4fb; }
.pop { position: absolute; left: 50%; bottom: 27%; z-index: 1; transform: translate(-50%, 110%); transition: transform .3s cubic-bezier(.3,1.4,.5,1);
  display: flex; flex-direction: column; align-items: center; border: none; background: none; padding: 0; touch-action: none; }
.pop.up { transform: translate(-50%, 0); }
.pop.bonk { animation: popbonk .5s forwards; }
@keyframes popbonk { 30% { transform: translate(-50%, 0) scale(1.15, .8); } 100% { transform: translate(-50%, 110%); } }
.pop.wrong .sign { animation: shake .4s; }
.pop .sign { padding: 4px 10px; border-radius: 12px; background: var(--snow); color: var(--ink); font-size: clamp(28px, 7.5cqh, 50px); line-height: 1.1; box-shadow: 0 3px 0 var(--frost-d); }
.pop .sm { font-size: clamp(40px, 10cqh, 70px); line-height: 1; }
.dressing { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; gap: clamp(16px, 4vw, 50px); }
.snowbox { position: relative; flex: none; height: min(96%, 520px); aspect-ratio: 200 / 260; container-type: size; }
.snowbox svg { width: 100%; height: 100%; display: block; }
.snowbox.happy svg { animation: dance .5s ease-in-out 3; }
.worn .wi { position: absolute; transform: translate(-50%, -50%); line-height: 1; animation: popin .4s; pointer-events: none; }
.dside { display: flex; flex-direction: column; align-items: center; gap: 12px; min-width: 0; }
.tray { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.titem { border: none; width: clamp(76px, 15cqh, 110px); aspect-ratio: 1; border-radius: 20px; background: var(--snow); font-size: clamp(40px, 9cqh, 66px); box-shadow: 0 6px 0 var(--frost-d); touch-action: none; }
.titem.wrong { animation: shake .4s; }
.titem.dragging { opacity: .3; }
.titem.ghost { position: fixed; z-index: 9; pointer-events: none; transform: translate(-50%, -50%) rotate(-6deg); }
@media (orientation: portrait) { .dressing { flex-direction: column; } .snowbox { height: 52%; } }
.flake.bub { background: radial-gradient(circle at 30% 28%, #fff 0 12%, #bfe3ff 13%, #7cc0f5 70%); box-shadow: 0 7px 0 #4f8fc4; color: var(--ink); }
.flake.bub::before { content: none; }

/* ---------- hide and seek, sentence order, sled race, ice fishing ---------- */
.hidegame, .orderg, .fishing { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(10px, 3cqh, 26px); }
.woods { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(8px, 2cqh, 18px) clamp(16px, 5vw, 60px); }
.htree { position: relative; width: clamp(120px, 26cqh, 200px); aspect-ratio: 1; border: none; background: none; padding: 0; overflow: visible; }
.htree .tr { position: absolute; inset: 0; z-index: 2; font-size: clamp(110px, 25cqh, 190px); line-height: 1; filter: drop-shadow(0 6px 4px rgba(0,0,0,.35)); }
.htree .hani { position: absolute; left: 50%; top: 30%; z-index: 1; font-size: clamp(44px, 9cqh, 70px); line-height: 1; animation: peek 3.2s ease-in-out var(--d) infinite; }
@keyframes peek { 0%, 100% { transform: translate(-50%, 0); } 35%, 65% { transform: translate(-125%, -10%) rotate(-12deg); } }
.htree.found .hani { animation: none; z-index: 3; transform: translate(-50%, -75%) scale(1.15); transition: transform .4s cubic-bezier(.3,1.7,.5,1); }
.htree.found .tr { opacity: .55; }
.htree.wrong .tr { animation: shake .4s; }
.orderg .pic, .fishing .pic { font-size: clamp(60px, 14cqh, 100px); }
.oslots { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end; gap: 10px; }
.oslot { min-width: clamp(70px, 12vw, 120px); height: clamp(52px, 10cqh, 70px); border-radius: 14px; border: 3px dashed rgba(245,248,255,.6);
  display: grid; place-items: center; padding: 0 14px; font-family: var(--f-word); font-weight: 700; font-size: clamp(24px, 5.5cqh, 38px); }
.oslot.filled { border: 3px solid var(--gold); background: var(--snow); color: var(--ink); animation: popin .3s; }
.odot { font-family: var(--f-word); font-size: 40px; font-weight: 700; }
.otiles .wbtn.used { visibility: hidden; }
.otiles .wbtn.wrong { opacity: 1; }
.racegame .track { position: relative; flex: 0 0 34%; display: flex; flex-direction: column; justify-content: space-around; padding: 0 12% 0 3%;
  background: repeating-linear-gradient(90deg, rgba(255,255,255,.18) 0 2px, transparent 2px 70px); border-radius: 20px; }
.racegame .lane { position: relative; height: 42%; border-bottom: 4px dashed rgba(245,248,255,.6); }
.racer { --p: 0; position: absolute; bottom: 0; left: calc(var(--p) * 100%); transition: left .8s cubic-bezier(.3,1.3,.5,1); font-size: clamp(44px, 10vmin, 84px); line-height: 1; white-space: nowrap; }
.racer.me span { font-size: .7em; margin-left: -.55em; vertical-align: top; }
.racer.me.win { animation: hopwin .5s ease-in-out 3; }
@keyframes hopwin { 50% { transform: translateY(-20px); } }
.racegame .goal { position: absolute; right: 2%; top: 50%; transform: translateY(-50%); font-size: clamp(48px, 10vmin, 80px); }
.pond { position: relative; width: min(100%, 900px); flex: 1; max-height: 64%; border-radius: 30px; overflow: hidden;
  background: linear-gradient(#e8f4fd 0 12%, #5b9bd5 12%, #2f6aa8 55%, #1d4677); box-shadow: inset 0 8px 0 rgba(255,255,255,.7); }
.pond .icehole { position: absolute; left: 50%; top: 4%; width: 120px; height: 34px; transform: translateX(-50%); border-radius: 50%; background: #23558f; box-shadow: 0 0 0 6px #eaf5ff; z-index: 2; }

@keyframes swimR { from { left: -22%; } to { left: 104%; } }
@keyframes swimL { from { left: 104%; } to { left: -22%; } }

/* ---------- side stages ---------- */

.pl { font-family: var(--f-word); font-weight: 700; font-size: clamp(15px, 3.6cqh, 22px); line-height: 1.2; padding: 0 8px 2px; border-radius: 8px; background: var(--snow); color: var(--ink); box-shadow: 0 2px 0 var(--frost-d); }
.cans { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(10px, 2cqh, 18px); }
.cans.hint { animation: shake .5s; }
.can {
  position: relative; width: clamp(62px, 13cqh, 96px); aspect-ratio: .9; padding: 0; border: none; border-radius: 10px 10px 16px 16px;

}

.can::after { content: ""; position: absolute; left: 28%; top: 28%; width: 15%; height: 30%; border-radius: 0 0 8px 8px; background: var(--c); }
.can.sel { transform: translateY(-10px) rotate(-6deg); box-shadow: 0 5px 0 #6b768a, 0 0 0 5px var(--gold); }
@media (orientation: portrait) {
  .paintgame { flex-direction: column; }

}
.deliver { width: 100%; height: 100%; display: flex; flex-direction: column; gap: 10px; }
.street { position: relative; flex: none; display: flex; justify-content: space-around; align-items: flex-end; padding: 46px 8px 8px; border-radius: 22px; background: rgba(14,28,58,.6); }
.house { font-size: clamp(28px, 5vmin, 46px); line-height: 1; filter: grayscale(.9) brightness(.6); transition: filter .4s; position: relative; }
.house.lit { filter: drop-shadow(0 0 10px var(--gold)); }
.house.lit::after { content: "💌"; position: absolute; left: 50%; top: -26px; transform: translateX(-50%); font-size: 22px; }
.street .rd { position: absolute; top: 2px; font-size: clamp(26px, 4.5vmin, 40px); transform: translateX(-50%); transition: left .6s; }
.post { width: 100%; max-width: 980px; height: 100%; display: flex; flex-direction: column; justify-content: space-around; gap: 2cqh; }
.houses { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(10px, 2.5vw, 26px); align-items: end; }
.phouse { position: relative; display: flex; flex-direction: column; align-items: center; }
.proof { width: 100%; aspect-ratio: 2.4; background: linear-gradient(var(--berry), var(--berry-d)); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.pdoor {
  width: 84%; aspect-ratio: 1; max-height: 26cqh; display: grid; place-items: center; position: relative;
  border-radius: 0 0 16px 16px; background: #f3e3c3; color: var(--ink); font-size: clamp(40px, 12cqh, 90px);

}

.phouse.done::after { content: "💌"; position: absolute; right: 2%; top: 22%; font-size: clamp(24px, 6cqh, 40px); animation: popin .4s; }

.sled { display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; padding: 14px; border-radius: 28px; background: rgba(14,28,58,.72); }

.letters { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; min-height: 1em; }

              linear-gradient(to bottom left, transparent 48%, rgba(201,179,138,.55) 50%, transparent 54%) right / 50% 100% no-repeat;
}
.letter span { position: relative; }

.letter.ghost { position: fixed; z-index: 9; pointer-events: none; transform: translate(-50%, -60%) rotate(-5deg); box-shadow: 0 12px 20px rgba(0,0,0,.35); }
.dq { flex: 1; min-height: 0; display: grid; place-items: center; container-type: size; grid-template-columns: minmax(0, 1fr); }

.shelf { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; width: 100%; padding: 12px; border-radius: 24px; background: #6e4529; box-shadow: inset 0 -8px 0 #4f301b; }

.ing { border: none; aspect-ratio: 1; border-radius: 18px; background: var(--snow); color: var(--ink); font-size: clamp(36px, 10cqh, 70px); box-shadow: 0 5px 0 var(--frost-d); }

.inbowl span { animation: popin .4s; }

/* ---------- encouragement bubble, toast, reminder ---------- */
/* the bubble covers the game's title row for a moment (placed by cheer()), never the answers */
.cheer {
  position: fixed; z-index: 4; left: 50%; top: 40px;
  transform: translate(-50%, -50%); max-width: calc(100% - 32px); max-height: 60px;
  transition: opacity .3s;
  display: flex; align-items: center; gap: 10px;
  padding: 4px 22px 4px 12px; border-radius: 999px;
  background: var(--gold-l); color: var(--ink); box-shadow: 0 6px 0 var(--gold-d);
  font-size: clamp(22px, 3.6vmin, 30px); font-weight: 700; white-space: nowrap; pointer-events: none;
}
.cheer-emo { font-size: 1.25em; }
.cheer-en { font-family: var(--f-word); font-size: 1.15em; }
.cheer-zh { font-size: .72em; font-weight: 400; color: var(--ink-2); }
.cheer.show { animation: cheerin .35s cubic-bezier(.3,1.6,.5,1); }
@keyframes cheerin { from { transform: translate(-50%, -50%) scale(.4); opacity: 0; } }
.cheer.out { opacity: 0; }
.toast {
  position: fixed; z-index: 8; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 14px); transform: translateX(-50%);
  max-width: calc(100% - 32px); padding: 10px 22px; border-radius: 999px;
  background: var(--snow); color: var(--ink); box-shadow: 0 6px 0 var(--frost-d);
  font-size: 21px; font-weight: 700; animation: cheerin .35s cubic-bezier(.3,1.6,.5,1); pointer-events: none;
}
.remind {
  position: fixed; z-index: 7; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
  width: min(420px, calc(100% - 32px)); display: flex; gap: 14px; align-items: center;
  padding: 16px; border-radius: 26px; background: var(--snow); color: var(--ink); box-shadow: 0 8px 0 var(--frost-d);
  animation: cheerin .4s cubic-bezier(.3,1.6,.5,1);
}
.remind .re { flex: none; width: 76px; height: 76px; }
.remind b { font-family: var(--f-word); font-size: 24px; display: block; }
.remind p { margin: 4px 0 10px; font-size: 18px; color: var(--ink-2); }
.remind .btn { min-height: 48px; font-size: 19px; padding: 6px 22px; }

/* ---------- overlays ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 5; display: grid; place-items: center;
  padding: 20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px));
  background: rgba(8,16,36,.74); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
#modal { z-index: 6; }
.panel {
  width: min(580px, 100%); max-height: 100%; overflow-y: auto;
  background: var(--snow); color: var(--ink); border-radius: 34px; padding: 24px;
  text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px;
  box-shadow: 0 10px 0 var(--frost-d);
}
.panel.wide { width: min(860px, 100%); }
.panel h2 { margin: 0; font-family: var(--f-display); font-size: 34px; color: var(--berry-d); }
.panel p { margin: 0; font-size: 19px; color: #3f4f73; }

  font: inherit; font-size: 22px; width: 100%; max-width: 360px; padding: 10px 16px; border-radius: 16px;
  border: 3px solid var(--frost-d); background: #fff; color: var(--ink); color-scheme: light;
  -webkit-user-select: text; user-select: text;
}
.rstars { display: flex; gap: 8px; }
.rstars span { font-size: 62px; line-height: 1; color: var(--frost); }
.rstars span.on { color: var(--gold); text-shadow: 0 4px 0 var(--gold-d); animation: popin .5s backwards; }
.rstars span:nth-child(2) { animation-delay: .25s !important; }
.rstars span:nth-child(3) { animation-delay: .5s !important; }
.rbells { font-size: 21px; font-weight: 700; color: var(--gold-d); }
.rgrow { display: flex; align-items: center; gap: 10px; padding: 8px 16px; border-radius: 18px; background: var(--gold-l); font-size: 19px; font-weight: 700; }
.rgrow .ge { flex: none; width: 56px; height: 56px; }
.rwords { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.wchip {
  border: none; display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 999px;
  background: var(--gold-l); color: var(--ink); font-family: var(--f-word); font-weight: 700; font-size: 20px;
}
.wchip .emo, .wchip .gift { font-size: 24px; }
.row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
.msgs { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.msg { border: 3px solid var(--frost); border-radius: 999px; padding: 6px 14px; background: #fff; color: var(--ink); font-family: var(--f-word); font-weight: 700; font-size: 18px; }
.msg.on { border-color: var(--berry); background: #ffe9ea; }
.pctext { width: min(100%, 520px); font-size: 22px; padding: 10px 16px; border-radius: 14px; border: 3px solid var(--frost); font-family: "Huninn", var(--f-body); }
.pctext:focus { outline: none; border-color: var(--berry); }
.fpicks { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.fpick { border: 3px solid var(--frost); border-radius: 14px; padding: 6px 16px; background: #fff; color: #a8272c; font-size: 30px; }
.fpick.on { border-color: var(--berry); background: #ffe9ea; }
.pchelp { margin: 0; font-size: 19px; color: #3f4f73; }
.pchelp.warn { background: var(--gold-l); border: 3px solid var(--gold); border-radius: 16px; padding: 10px 14px; color: var(--ink); font-weight: 700; }
.pcimg { width: 100%; max-width: 640px; border-radius: 14px; box-shadow: 0 6px 16px rgba(0,0,0,.25); -webkit-touch-callout: default; -webkit-user-select: auto; user-select: auto; }

/* ---------- word bag ---------- */
.baghead { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.baghead h2 { margin: 0; font-family: var(--f-display); font-size: 30px; }
.baghead p { margin: 0; color: var(--frost); font-size: 18px; }

.bagscroll { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 12px; }
.bagsec { margin: 14px 0 8px; font-size: 18px; color: var(--gold); font-weight: 700; }
.baggrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 12px; }
.bcard {
  position: relative; border: none; border-radius: 22px; padding: 14px 6px 10px; background: var(--snow); color: var(--ink);
  display: flex; flex-direction: column; align-items: center; gap: 6px; box-shadow: 0 5px 0 var(--frost-d);
}
.bcard.gold { background: var(--gold-l); box-shadow: 0 5px 0 var(--gold-d); }
.bcard.gold::after { content: "✔✔"; position: absolute; top: 6px; right: 10px; color: var(--pine); font-size: 14px; font-weight: 700; }
.bcard .emo, .bcard .gift { font-size: 46px; }
.bcard b { font-family: var(--f-word); font-size: 21px; }
.bcard.no { background: rgba(245,248,255,.08); color: var(--muted); box-shadow: none; }
.bcard.no .q { font-family: var(--f-display); font-size: 46px; line-height: 1; opacity: .5; }

/* ---------- cabin ---------- */
.cabin { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(280px, 1fr); gap: 14px; }
@media (orientation: portrait), (max-width: 760px) { .cabin { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); } }
.cabin-view { min-width: 0; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.cabin-view canvas {
  display: block; align-self: center; width: auto; height: auto; max-width: 100%;
  max-height: calc(100vh - 220px); max-height: calc(100dvh - 220px);
  border-radius: 22px; box-shadow: 0 8px 0 #24150c; background: #3e281d; touch-action: none; cursor: grab;
}

  .cabin-view canvas { max-height: 44vh; max-height: 44dvh; }
}
.cabin-view .row { margin: 0; justify-content: flex-start; align-items: center; flex-wrap: wrap; }
.ctip { margin: 0; color: var(--frost); font-size: 17px; }
.treepick { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tp { border: none; border-radius: 16px; padding: 4px 8px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; background: rgba(245,248,255,.1); color: var(--snow); font-size: 15px; font-weight: 700; }
.tp canvas { width: 54px; height: 64px; }
.tp.on { background: var(--gold-l); color: var(--ink); box-shadow: 0 0 0 3px var(--gold); }
.shop { min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; }
.shop h3 { margin: 10px 0 2px; font-size: 19px; color: var(--gold); }
.sitem { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 18px; background: rgba(245,248,255,.1); }
.sitem .si { font-size: 40px; text-align: center; }
.sitem .sicv { width: 52px; height: 52px; display: block; margin: 0 auto; }
.sitem .sn { min-width: 0; display: flex; flex-direction: column; }
.sitem .sn b { font-size: 18px; }
.sitem .sn small { font-family: var(--f-word); color: var(--frost); font-size: 16px; }
.sbuy { border: none; border-radius: 14px; min-height: 48px; min-width: 92px; padding: 4px 12px; background: var(--gold); color: var(--ink); font-size: 18px; font-weight: 700; box-shadow: 0 4px 0 var(--gold-d); white-space: nowrap; }
.sbuy.confirm { background: var(--berry); color: #fff; box-shadow: 0 4px 0 var(--berry-d); }
.sbuy:disabled { background: rgba(245,248,255,.2); color: var(--muted); box-shadow: none; cursor: default; }
.sbuy.own { background: var(--pine); color: #fff; box-shadow: 0 4px 0 var(--pine-d); }
.sbuy.own:disabled { box-shadow: none; }
.sbuy.off { background: rgba(245,248,255,.22); color: var(--snow); box-shadow: 0 4px 0 rgba(0,0,0,.25); }

/* ---------- advent calendar ---------- */
.advent { flex: 1; min-height: 0; display: grid; place-items: center; container-type: size; }
.agrid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: clamp(6px, 1.5cqh, 12px); width: min(100cqw, 96cqh, 720px); }
/* every closed door looks the same; only today's door glows and opened ones turn cream */
.adoor {
  position: relative; aspect-ratio: 1; border: none; border-radius: 16px;
  font-family: var(--f-num); font-weight: 900; font-size: clamp(20px, 5cqh, 36px); color: var(--gold-l);
  background: var(--berry); box-shadow: 0 5px 0 var(--berry-d), inset 0 0 0 4px rgba(255,241,199,.28);
  display: grid; place-items: center;
}
.adoor:disabled { color: var(--gold-l); opacity: 1; }
.adoor.open { background: var(--gold-l); box-shadow: 0 5px 0 var(--gold-d); font-size: clamp(26px, 7cqh, 48px); }
.adoor.ready { color: var(--ink); background: var(--gold); box-shadow: 0 5px 0 var(--gold-d), 0 0 0 5px var(--gold-l), 0 0 26px 6px rgba(255,197,61,.6); animation: pulse 1.4s ease-in-out infinite; }
.adoor.flip { animation: flipopen .6s; }
.adoor.big { box-shadow: 0 5px 0 var(--berry-d), inset 0 0 0 4px var(--gold); flex-direction: column; gap: 0; }
.adoor.big small { font-size: .5em; line-height: 1; }
.apager { display: flex; align-items: center; justify-content: center; gap: 14px; font-weight: 700; font-size: 20px; }
.apager .chip:disabled { opacity: .35; }
@keyframes flipopen { 50% { transform: rotateY(90deg); } }
.anote { margin: 0; text-align: center; font-size: 20px; text-shadow: 0 2px 4px rgba(0,0,0,.6); }

/* ---------- parent page (for adults; no 注音) ---------- */
.parent { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; font-size: 18px; }
.psec { background: var(--snow); color: var(--ink); border-radius: 22px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.psec h3 { margin: 0; font-size: 21px; color: var(--berry-d); }
.psec p { margin: 0; color: var(--ink-2); }
.pstats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.pstat { background: #eef3fc; border-radius: 16px; padding: 10px 14px; }
.pstat b { display: block; font-family: var(--f-num); font-weight: 800; font-size: 34px; line-height: 1.15; color: var(--ink); font-variant-numeric: tabular-nums; }
.pstat b em { font-style: normal; font-family: var(--f-body); font-size: 17px; font-weight: 700; color: var(--ink-2); margin-left: 4px; }
.pstat b em.of { font-family: var(--f-num); font-size: 20px; }
.pstat span { font-size: 15px; color: var(--ink-2); }
.weak { display: flex; flex-wrap: wrap; gap: 8px; }
.weak button { border: none; border-radius: 999px; padding: 6px 14px; background: #ffe9ea; color: var(--ink); font-family: var(--f-word); font-size: 18px; font-weight: 700; }

/* ---------- stage backgrounds ---------- */

/* ---------- final-stage reward ---------- */
.reward {

}
.rw-cv { position: absolute; inset: 0; width: 100%; height: 100%; }
.rw-stage { position: absolute; inset: 0; }

  width: max-content; max-width: calc(100% - 32px); text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  animation: rwmsg .7s .9s backwards cubic-bezier(.3,1.6,.5,1);
}
.rw-msg b {
  font-family: var(--f-display); font-weight: 800; font-size: clamp(44px, 9vmin, 96px); line-height: 1;

}

}
@keyframes blink { 50% { opacity: .35; } }
.rw-sleigh {
  position: absolute; left: 0; top: 50%; font-size: clamp(56px, 11vmin, 110px); white-space: nowrap; line-height: 1;

}

@keyframes fly { 0% { transform: translate(105vw, 8vh) rotate(-6deg); } 50% { transform: translate(30vw, -10vh) rotate(-2deg); } 100% { transform: translate(-80vw, 4vh) rotate(5deg); } }
@keyframes bob { to { transform: translateY(-10%); } }
.rw-drop { position: absolute; font-size: clamp(34px, 6vmin, 56px); animation: drop 1.8s ease-in forwards; }
@keyframes drop { to { transform: translateY(75vh) rotate(220deg); opacity: .2; } }
.rw-gift {
  position: absolute; left: 50%; top: 62%; width: clamp(170px, 32vmin, 280px); aspect-ratio: 1;
  transform: translate(-50%, -50%); font-size: clamp(60px, 12vmin, 104px);
  animation: giftshake .5s .3s 3;
}
.rw-gift .body {

}

  position: absolute; left: 0; right: 0; top: 16%; height: 20%; border-radius: 14%;
  background: #f0595e; box-shadow: inset 0 -8px 0 rgba(0,0,0,.15);
  transition: transform .7s cubic-bezier(.3,1.4,.5,1), opacity .7s .2s;
}
.rw-gift .body::before, .rw-gift .lid::before {
  content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 16%; transform: translateX(-50%); background: var(--gold);
}
.rw-gift .lid::after { content: "🎀"; position: absolute; left: 50%; bottom: 62%; transform: translateX(-50%); line-height: 1; }
.rw-gift.open { animation: none; }

@keyframes giftshake { 25% { transform: translate(-50%, -50%) rotate(-9deg); } 75% { transform: translate(-50%, -50%) rotate(9deg); } }
.rw-pop {

  animation: popout 1.5s cubic-bezier(.2,.8,.3,1) forwards;
}
@keyframes popout {

.albumg { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; gap: 16px; }

.aplay { display: flex; flex-direction: column; align-items: center; gap: 12px; min-width: 0; }

/* word statistics: ok = times answered, bad = times missed first; weak words come back more often */
function stat(w) { const ws = L().words; return ws[w] || (ws[w] = { ok: 0, bad: 0 }); }
const isWeak = w => { const s = L().words[w]; return !!s && s.bad > 0 && s.ok - s.bad < 2; };
function record(w, wrong) {
  const s = stat(w); if (wrong) s.bad++; s.ok++; s.last = Date.now();
  daily('correct');
}
function pickTargets(pool, n) {
  const weak = shuffle(pool.filter(it => isWeak(it.w))).slice(0, Math.min(2, n));
  const rest = shuffle(pool.filter(it => !weak.includes(it)));
  return shuffle([...weak, ...rest.slice(0, n - weak.length)]);
}

const canSpeak = 'speechSynthesis' in window;

         || vs.find(v => /en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;

         || vs.find(v => /zh[-_]TW/i.test(v.lang)) || vs.find(v => /zh[-_]Hant/i.test(v.lang)) || null;

function speakSeq(parts) {
  if (!canSpeak) return;
  paceToken++;
  try {
    speechSynthesis.cancel();
    parts.forEach(([text, zh, rate]) => {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = zh ? 'zh-TW' : 'en-US';
      const v = zh ? voiceZh : voiceEn; if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = rate || (zh ? zhRate() : 0.8); u.pitch = zh ? 1.15 : 1.1;

    });
  } catch (e) {}
}

// parts: [[text, isChinese, rate, pauseAfterMs], ...] -- waits for each part to end, then pauses
let paceToken = 0;
function speakPaced(parts) {
  if (!canSpeak) return;
  const my = ++paceToken;
  try { speechSynthesis.cancel(); } catch (e) {}
  let i = 0;
  const next = () => {
    if (my !== paceToken || i >= parts.length) return;
    const [text, zh, rate, gap = 0] = parts[i++];
    let done = false;
    const go = () => { if (done) return; done = true; setTimeout(next, gap); };
    try {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = zh ? 'zh-TW' : 'en-US';
      const v = zh ? voiceZh : voiceEn; if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = rate; u.pitch = zh ? 1.15 : 1.1;
      u.onend = go; u.onerror = go;
      speechSynthesis.speak(u);
    } catch (e) { go(); }
    setTimeout(go, text.length * 450 + 4000);  // some voices never say they are done
  };
  next();
}

}

// Shared multiple-choice round: shows the word; the speaker plays it on request.
function quiz(el, cfg) {
  let i = 0, mistakes = 0;
  el.innerHTML = `<div class="quiz"><div class="prompt"></div><div class="opts"></div></div>`;
  const promptEl = el.querySelector('.prompt'), optsEl = el.querySelector('.opts');
  function round() {
    if (!cfg.noDots) setDots(cfg.targets.length, i);
    if (i >= cfg.targets.length) { cfg.onDone(mistakes); return; }
    const t = cfg.targets[i];
    const others = cfg.pool.filter(x => x.w !== t.w && (x.e || x.c) !== (t.e || t.c));
    const opts = shuffle([t, ...sample(others, cfg.nOpt - 1)]);
    promptEl.innerHTML = cfg.listenOnly
      ? `<div class="ask"><button class="say big" aria-label="聽發音">🔊</button><span class="word-prompt" hidden>${esc(t.w)}</span></div>
         <p class="sub">${zy('聽聽看，是哪一個？')}</p>`
      : `<div class="ask"><span class="word-prompt">${esc(t.w)}</span><button class="say" aria-label="聽發音">🔊</button></div>
         <p class="sub">${zy('這個字是哪一個？')}</p>`;
    const sayBtn = promptEl.querySelector('.say');
    sayBtn.onclick = () => speak(t.w);
    if (cfg.listenOnly) later(() => speak(t.w), 450);
    let tries = 0;
    optsEl.innerHTML = opts.map((o, k) => `<button class="opt" data-k="${k}">${face(o)}<span class="lbl">${esc(o.w)}</span></button>`).join('');
    let solved = false, wrong = false;
    optsEl.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      if (solved || b.classList.contains('wrong')) return;
      if (opts[+b.dataset.k].w === t.w) {
        solved = true; b.classList.add('right'); sfx.ok(); hideCheer();
        record(t.w, wrong); cfg.learned.add(t.w);
        later(() => speak(t.w), 150);
        if (cfg.onCorrect && cfg.onCorrect(i) === 'stop') return;
        i++; later(round, 1400);
      } else {
        b.classList.add('wrong'); mistakes++; wrong = true; sfx.no(); cheer();
        if (cfg.listenOnly && ++tries >= 2) promptEl.querySelector('.word-prompt').hidden = false;  // show the word after two misses
        if (cfg.onWrong) cfg.onWrong();
        sayBtn.classList.remove('wiggle'); void sayBtn.offsetWidth; sayBtn.classList.add('wiggle');
      }
    });
  }
  round();
}

  spell(ctx, mode = 'first') {
    const two = mode === 'two';
    const words = pickTargets(ctx.pool.filter(it => /^[A-Za-z]+$/.test(it.w)), 6);
    let i = 0, mistakes = 0;
    ctx.stage.innerHTML = `<div class="spell"><button class="pic" aria-label="聽發音"></button><div class="slots"></div><div class="flakes"></div></div>`;
    const pic = ctx.stage.querySelector('.pic'), slots = ctx.stage.querySelector('.slots'), flakes = ctx.stage.querySelector('.flakes');
    function round() {
      setDots(words.length, i);
      if (i >= words.length) { later(() => ctx.done(mistakes), 400); return; }
      const t = words[i], w = t.w, low = w.toLowerCase();
      let blanks;
      if (mode === 'last') blanks = [w.length - 1];
      else if (!two) blanks = [0];
      else if (w.length < 4) blanks = [Math.floor(Math.random() * w.length)];
      else blanks = sample([...w].map((_, k) => k), 2).sort((a, b) => a - b);
      let bi = 0, wrong = false;
      pic.innerHTML = face(t) + '<small>🔊</small>';
      pic.onclick = () => speak(w);
      later(() => speak(w), 300);
      // "initial": only the picture and the sound; every letter stays hidden until the first one is chosen
      const hide = k => blanks.includes(k) || mode === 'initial';
      slots.innerHTML = [...w].map((ch, k) => `<span class="slot ${hide(k) ? 'blank' : ''}">${hide(k) ? '' : ch}</span>`).join('');
      function ask() {
        const idx = blanks[bi], ans = low[idx];
        [...slots.children].forEach((s, k) => s.classList.toggle('cur', k === idx));
        const letters = 'abcdefghijklmnopqrstuvwxyz'.split('').filter(c => c !== ans);
        const opts = shuffle([ans, ...sample(letters, ctx.ver === 'basic' ? 1 : 2)]);
        flakes.innerHTML = opts.map(c => `<button class="flake" data-c="${c}"><span>${c}</span></button>`).join('');
        let solved = false;
        flakes.querySelectorAll('.flake').forEach(b => b.onclick = () => {
          if (solved || b.classList.contains('wrong')) return;
          if (b.dataset.c === ans) {
            solved = true; hideCheer();
            const slot = slots.children[idx];
            slot.textContent = w[idx]; slot.classList.remove('cur'); slot.classList.add('filled');
            sfx.ok(); bi++;
            if (bi < blanks.length) { later(ask, 500); return; }
            if (mode === 'initial') [...slots.children].forEach((sl, k) => { sl.textContent = w[k]; sl.classList.remove('blank'); sl.classList.add('filled'); });
            record(w, wrong); ctx.learned.add(w);
            later(() => speak(w), 200);
            i++; later(round, 1500);
          } else {
            b.classList.add('wrong'); mistakes++; wrong = true; sfx.no(); cheer();
          }
        });
      }
      ask();
    }
    round();
  },

        `<span class="wi" style="left:${x / 2}%;top:${y / 2.6}%;font-size:${sz * .3}cqh">${it.e}</span>`).join('')).join('');
    };
    function round() {
      setDots(targets.length, i);
      if (i >= targets.length) {
        box.classList.add('happy'); sfx.win(); later(() => speak('What a cool snowman!', 0.9), 300);
        later(() => ctx.done(mistakes), 2200); return;
      }
      const t = targets[i], opts = shuffle([t, ...sample(pool.filter(x => x.w !== t.w && x.e !== t.e), ctx.nOpt - 1)]);
      let wrong = false;
      wp.textContent = t.w;
      ctx.stage.querySelector('.dside .say').onclick = () => speak(t.w);
      later(() => speak(t.w), 300);
      tray.innerHTML = opts.map((o, k) => `<button class="titem" data-k="${k}">${o.e}</button>`).join('');
      const tryWear = (btn, onSnowman) => {
        if (!onSnowman) return;
        const o = opts[+btn.dataset.k];
        if (o.w === t.w) {
          worn[DRESS_SLOT[o.w]] = o; drawWorn(); btn.remove(); sfx.ok(); hideCheer(); speak(t.w);
          record(t.w, wrong); ctx.learned.add(t.w);
          i++; later(round, 1300);
        } else {
          btn.classList.remove('wrong'); void btn.offsetWidth; btn.classList.add('wrong');
          mistakes++; wrong = true; sfx.no(); cheer([[o.w, false]]);
        }
      };
      tray.querySelectorAll('.titem').forEach(btn => btn.addEventListener('pointerdown', e => {
        e.preventDefault();
        const sx = e.clientX, sy = e.clientY;
        let ghost = null;
        const move = ev => {
          if (!ghost && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 10) { ghost = btn.cloneNode(true); ghost.classList.add('ghost'); document.body.appendChild(ghost); btn.classList.add('dragging'); }
          if (ghost) { ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px'; }
        };
        const up = ev => {
          removeEventListener('pointermove', move); removeEventListener('pointerup', up); removeEventListener('pointercancel', up);
          if (ghost) {
            ghost.remove(); btn.classList.remove('dragging');
            const r = box.getBoundingClientRect();
            if (ev.type === 'pointerup') tryWear(btn, ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom);
          } else tryWear(btn, true);  // a tap puts it on straight away
        };
        addEventListener('pointermove', move); addEventListener('pointerup', up); addEventListener('pointercancel', up);
      }));
    }
    round();
  },

  grammar(ctx, topic) {
    const items = sample(SENT[topic](), 6);
    let i = 0, mistakes = 0;
    ctx.stage.innerHTML = `<div class="gram"><div class="gvwrap"></div>
      <div class="sentrow"><div class="sentence"></div><button class="say" aria-label="聽句子">🔊</button></div>
      <div class="wopts"></div></div>`;
    const vis = ctx.stage.querySelector('.gvwrap'), sent = ctx.stage.querySelector('.sentence'),
          sayBtn = ctx.stage.querySelector('.say'), wopts = ctx.stage.querySelector('.wopts');
    function round() {
      setDots(items.length, i);
      if (i >= items.length) { later(() => ctx.done(mistakes), 400); return; }
      const it = items[i], [pre, post] = it.s.split('___');
      vis.innerHTML = it.vis;
      sent.innerHTML = `${esc(pre)}<span class="gblank">&nbsp;</span>${esc(post)}`;
      sayBtn.onclick = () => speak(it.s.replace('___', it.a), 0.8);
      later(() => speak(it.s.replace('___', it.a), 0.8), 400);
      wopts.innerHTML = shuffle(it.opts).map(o => `<button class="wbtn" data-o="${o}">${o}</button>`).join('');
      let solved = false, wrong = false;
      wopts.querySelectorAll('.wbtn').forEach(b => b.onclick = () => {
        if (solved || b.classList.contains('wrong')) return;
        if (b.dataset.o === it.a) {
          solved = true; b.classList.add('right'); sfx.ok(); hideCheer();

  gate(ctx) {
    const earlier = WORLDS.slice(0, ctx.w).flatMap(W => WORDS[version][W.key]).filter(it => isWeak(it.w));
    const extra = sample(earlier, 2);
    const targets = shuffle([...pickTargets(ctx.pool, 8 - extra.length), ...extra]);
    const pool = [...ctx.pool, ...extra];
    ctx.stage.innerHTML = `<div class="boss"><div class="doorbox">${doorSVG(WORLDS[ctx.w + 1] ? WORLDS[ctx.w + 1].icon : '🎄')}</div><div class="bossq"></div></div>`;
    const cracks = ctx.stage.querySelectorAll('.crack');
    pickWord(ctx.stage.querySelector('.bossq'), {
      targets, pool, learned: ctx.learned,
      onCorrect: i => { if (cracks[i]) cracks[i].classList.add('on'); tone(420 - i * 20, 0, .2, 'triangle', .08); },
      onDone: m => {
        const box = ctx.stage.querySelector('.doorbox');
        box.classList.add('shake');
        later(() => { box.classList.remove('shake'); box.classList.add('break'); sfx.crash(); }, 450);
        later(() => { sfx.win(); speak('The ice door is open!', 0.9); }, 1200);
        later(() => ctx.done(m), 2800);
      }
    });
  },

  final(ctx) {
    const review = WORLDS.slice(0, 4).flatMap(W => WORDS[version][W.key]).filter(it => !it.c);
    const targets = shuffle([...pickTargets(ctx.pool, 4), ...pickTargets(review, 4)]);
    const pool = [...review, ...ctx.pool];
    ctx.stage.innerHTML = `<div class="boss"><div class="treebox">${treeSVG()}</div><div class="bossq"></div></div>`;
    const orns = ctx.stage.querySelectorAll('.orn');
    quiz(ctx.stage.querySelector('.bossq'), {
      targets, pool, nOpt: ctx.nOpt, learned: ctx.learned,
      onCorrect: i => { if (orns[i]) orns[i].classList.add('on'); },
      onDone: m => {
        ctx.stage.querySelector('.treebox').classList.add('lit');
        sfx.win();
        later(() => playReward(() => ctx.done(m)), 1400);
      }
    });
  },

  /* ---- side stages ---- */
  deliver(ctx) {
    // 3 rounds of 4 houses; no two houses in a round share a picture
    const seen = new Set();
    const pool = shuffle(openPool()).filter(it => { const k = it.e || it.c; if (seen.has(k)) return false; seen.add(k); return true; });
    const all = pickTargets(pool, 12), rounds = [all.slice(0, 4), all.slice(4, 8), all.slice(8, 12)].filter(x => x.length);
    let r = 0, mistakes = 0, delivered = 0;
    ctx.stage.innerHTML = `<div class="post"><div class="houses"></div>
      <div class="sled"><span class="sdeer" aria-hidden="true">🦌🛷</span><div class="letters"></div></div></div>`;
    const housesEl = ctx.stage.querySelector('.houses'), lettersEl = ctx.stage.querySelector('.letters');
    const houseAt = (x, y) => { const el = document.elementFromPoint(x, y); return el && el.closest('.phouse'); };
    setDots(all.length, 0);
    function round() {
      if (r >= rounds.length) { later(() => ctx.done(mistakes), 600); return; }
      const set = rounds[r], missed = new Set();
      let left = set.length, sel = null;
      housesEl.innerHTML = shuffle(set).map(it => `<div class="phouse" data-w="${esc(it.w)}"><span class="proof"></span><span class="pdoor">${face(it)}</span></div>`).join('');
      lettersEl.innerHTML = shuffle(set).map(it => `<button class="letter" data-w="${esc(it.w)}"><span>${esc(it.w)}</span></button>`).join('');
      const tryDeliver = (letter, house) => {
        if (!house || house.classList.contains('done')) return;
        const w = letter.dataset.w;
        if (house.dataset.w === w) {
          house.classList.add('done'); letter.remove(); sfx.ok(); hideCheer(); speak(w);
          record(w, missed.has(w)); ctx.learned.add(w);
          delivered++; setDots(all.length, delivered);
          if (--left === 0) { r++; later(round, 1300); }
        } else {
          house.classList.remove('wrong'); void house.offsetWidth; house.classList.add('wrong');
          mistakes++; missed.add(w); sfx.no(); cheer();
        }
      };
      lettersEl.querySelectorAll('.letter').forEach(L => L.addEventListener('pointerdown', e => {
        e.preventDefault();
        const sx = e.clientX, sy = e.clientY;
        let ghost = null;
        const move = ev => {
          if (!ghost && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 10) {
            ghost = L.cloneNode(true); ghost.classList.add('ghost'); document.body.appendChild(ghost);
            L.classList.add('dragging'); if (sel) { sel.classList.remove('sel'); sel = null; }
          }
          if (!ghost) return;
          ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px';
          const h = houseAt(ev.clientX, ev.clientY);
          housesEl.querySelectorAll('.phouse').forEach(x => x.classList.toggle('hover', x === h));
        };
        const up = ev => {
          removeEventListener('pointermove', move); removeEventListener('pointerup', up); removeEventListener('pointercancel', up);
          housesEl.querySelectorAll('.hover').forEach(x => x.classList.remove('hover'));
          if (ghost) { ghost.remove(); L.classList.remove('dragging'); if (ev.type === 'pointerup') tryDeliver(L, houseAt(ev.clientX, ev.clientY)); return; }
          // a tap picks the letter up; tapping a house then delivers it
          if (sel) sel.classList.remove('sel');
          sel = sel === L ? null : L;
          if (sel) { sel.classList.add('sel'); speak(L.dataset.w); }
        };
        addEventListener('pointermove', move); addEventListener('pointerup', up); addEventListener('pointercancel', up);
      }));
      housesEl.querySelectorAll('.phouse').forEach(H => H.onclick = () => {
        if (!sel) return;
        const L = sel; sel.classList.remove('sel'); sel = null;
        tryDeliver(L, H);
      });
    }
    round();
  },

  kitchen(ctx) {
    const foods = ctx.ver === 'basic' ? FOOD.basic : [...FOOD.basic, ...FOOD.more];
    const steps = pickTargets(foods, 5);
    let i = 0, mistakes = 0;
    ctx.stage.innerHTML = `<div class="kitchen">
      <div class="kprompt"><span class="word-prompt"></span><button class="say" aria-label="聽發音">🔊</button></div>
      <div class="shelf"></div>
      <div class="bowl"><span>🥣</span><span class="inbowl"></span></div></div>`;
    const wp = ctx.stage.querySelector('.word-prompt'), sayBtn = ctx.stage.querySelector('.say'),
          shelf = ctx.stage.querySelector('.shelf'), bowl = ctx.stage.querySelector('.bowl'), inbowl = ctx.stage.querySelector('.inbowl');
    function round() {
      setDots(steps.length, i);
      if (i >= steps.length) {
        wp.textContent = 'Bake!'; shelf.innerHTML = ''; speak("Let's bake!", 0.9);
        later(() => { bowl.innerHTML = '🍪'; bowl.classList.add('baked'); sfx.win(); speak('Yummy cookies!', 0.9); }, 900);
        later(() => ctx.done(mistakes), 2600);
